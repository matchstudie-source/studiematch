name: Test

on:
  push:
    paths: ["site/**", "collector/**", "tests/**", ".github/workflows/test.yml"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Installer
        run: pip install -r collector/requirements.txt
      - name: Test jobindsamleren
        run: python -m unittest discover -s collector/tests
      - name: Test matchningen med 12 uddannelser
        run: node tests/match.test.mjs
