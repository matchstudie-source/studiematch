name: Find virksomheder

on:
  schedule:
    - cron: "41 2 * * 1"   # hver mandag nat (UTC)
  workflow_dispatch: {}    # knap til at køre den manuelt under Actions
  push:
    paths: ["collector/companies.csv"]   # kører af sig selv, når listen over virksomheder ændres

permissions:
  contents: write

concurrency:
  group: hent-job          # kører aldrig samtidig med jobindsamlingen
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer
        run: |
          pip install -r collector/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Find jobsystemer og tilføj nye kilder
        run: python collector/discover.py --merge
      - name: Hent job fra de nye kilder med det samme
        run: python collector/collect.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Gem resultatet
        run: |
          git config user.name "studiematch-bot"
          git config user.email "studiematch-bot@users.noreply.github.com"
          git add collector/employers.csv collector/discovered.csv collector/discover_report.md site/data/jobs.json collector/cache.json collector/report.md collector/rejected.md
          git diff --cached --quiet || git commit -m "Nye kilder fra virksomhedsfinderen"
          git pull --rebase
          git push
