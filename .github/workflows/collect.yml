name: Hent job

on:
  schedule:
    - cron: "3 7,17 * * *"   # kl. 8 og 18 dansk vintertid (9 og 19 om sommeren), aftalt med StuderendeOnline
  workflow_dispatch: {}             # knap til at køre den manuelt under Actions
  push:                             # kører også, når læserne eller kildelisten ændres
    paths: ["collector/sources.py", "collector/enrich.py", "collector/collect.py", "collector/employers.csv", ".github/workflows/collect.yml"]

permissions:
  contents: write

concurrency:
  group: hent-job
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer
        run: |
          pip install -r collector/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Test indsamleren
        run: python -m unittest discover -s collector/tests -v
      - name: Test matchningen
        run: node tests/match.test.mjs
      - name: Hent og berig job
        run: |
          python collector/collect.py
          head -3 collector/report.md
          grep -i "studerendeonline" collector/report.md || true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STUDERENDEONLINE_API_URL: ${{ secrets.STUDERENDEONLINE_API_URL }}
          STUDERENDEONLINE_API_KEY: ${{ secrets.STUDERENDEONLINE_API_KEY }}
          STUDERENDEONLINE_JOB_URL: ${{ secrets.STUDERENDEONLINE_JOB_URL }}
      - name: Gem nye job
        run: |
          git config user.name "studiematch-bot"
          git config user.email "studiematch-bot@users.noreply.github.com"
          git add site/data/jobs.json collector/cache.json collector/translations.json collector/report.md collector/rejected.md
          git diff --cached --quiet || git commit -m "Opdater job"
          git pull --rebase -X theirs   # opstår der en konflikt med en anden kørsel, vinder de nyeste job
          git push
      - name: Send jobalarmer
        # Venter et par minutter, så den nye jobliste er online, før mails linker til den
        run: sleep 120 && node scripts/send_alerts.mjs
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://studiematch.dk
