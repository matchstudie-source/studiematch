name: Probe StuderendeOnline
on:
  push:
    paths: [.github/workflows/probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install requests beautifulsoup4 >/dev/null
          python - <<'PY'
          import requests, re
          from bs4 import BeautifulSoup
          H={"User-Agent":"StudiematchBot/1.0 (+https://studiematch.dk)"}
          for u in ["https://www.studerendeonline.dk/robots.txt","https://www.studerendeonline.dk/","https://www.studerendeonline.dk/job/","https://jobbank.dk/robots.txt"]:
              try:
                  r=requests.get(u,headers=H,timeout=20); print("==",u,r.status_code,r.url,len(r.text))
                  if u.endswith("robots.txt"): print(r.text[:1500]); continue
                  s=BeautifulSoup(r.text,"html.parser")
                  for l in s.find_all("link",type=re.compile("rss|atom")): print("FEED",l.get("href"))
                  for a in s.find_all("a",href=True):
                      h=a["href"]
                      if re.search(r"rss|feed|job|sog|search",h,re.I): print("A",h,"|",a.get_text(" ",strip=True)[:40])
                  for f in s.find_all("form"): print("FORM",f.get("action"),[i.get("name") for i in f.find_all(["input","select"])])
              except Exception as e: print("ERR",u,e)
          PY
