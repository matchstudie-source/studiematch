name: Undersøg Emply

on:
  push:
    paths: [".github/workflows/probe.yml", "collector/probe/emply_probe.py"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hent-job
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Installer browser
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Undersøg Emply-sider
        run: python collector/probe/emply_probe.py
      - name: Gem resultatet
        run: |
          git config user.name "studiematch-bot"
          git config user.email "studiematch-bot@users.noreply.github.com"
          git add collector/probe/emply_requests.json
          git diff --cached --quiet || git commit -m "Emply-undersøgelse"
          git pull --rebase
          git push
