<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Studiematch finder studiejob, der passer til din uddannelse. Gratis for studerende i Danmark.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="canonical" href="https://studiematch.dk/">
<title>Studiematch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: luftig app-skal. Desktop = navigation til venstre + feed (maks. 680px) + læringspanel (>=1180px). Mobil = én kolonne + fanebjælke i bunden. Bevidst ét lyst udtryk. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --wash:#F2FAF6; --surface:#FFFFFF; --surface-2:#F4F7F6; --fg:#1F2C33; --muted:#64737B; --line:#E3EAE7;
  --accent:#0B7D60; --accent-ink:#FFFFFF; --accent-soft:#E2F4EC;
  --good:#235FC2; --good-soft:#E7EFFC; --worth:#8A5800; --worth-soft:#FFF3D3;
  --hidden:#A23B78; --hidden-soft:#FBE9F3; --warn:#BF3A2B; --warn-soft:#FDECEA;
  --sun:#FFE073; --toast-bg:#1F2C33; --toast-fg:#FFFFFF;
  --scrim:rgba(31,44,51,.28); --shadow:0 1px 2px rgba(31,44,51,.04),0 10px 30px rgba(31,44,51,.06);
  --mono-s:62%; --mono-bg-l:93%; --mono-fg-l:30%; --knob:#FFFFFF;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-body:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-md:16px; --r-lg:24px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3{font-family:var(--font-display);font-weight:500;text-wrap:balance;margin:0;letter-spacing:-.015em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{width:100%;max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.hl{background:linear-gradient(transparent 60%,var(--sun) 60%,var(--sun) 90%,transparent 90%);padding:0 .05em}

/* knapper og felter */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid transparent;font-weight:700;cursor:pointer;padding:10px 18px;font-size:15px;line-height:1.2;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;filter:none}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-quiet{background:transparent;color:var(--accent);padding:8px 8px}
.btn-sm{padding:7px 14px;font-size:14px}
.btn-lg{padding:14px 24px;font-size:16px}
.input,.select{width:100%;font-family:inherit;resize:vertical;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:11px 15px;font-size:15.5px;min-width:0}
.input:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.input-lg{padding:15px 18px;font-size:16.5px;border-radius:999px}
.label{display:block;font-weight:700;font-size:14.5px;margin-bottom:8px}
.fine{font-size:13.5px;color:var(--muted)}
.region-group{margin:10px 0 6px;font-weight:600}
.region-any{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;font-weight:600;color:var(--fg)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip .x{opacity:.6}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.seg .chip{justify-content:center;padding:10px 6px;text-align:center}

/* topbjælke */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:16px;min-height:64px}
.logo{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-.02em;color:var(--fg);background:none;border:0;cursor:pointer;padding:0;flex:none}
.logo-mark{width:30px;height:30px;display:block;flex:none}
.logo-mark svg{width:100%;height:100%;display:block}
.top-links{margin-left:auto;display:flex;align-items:center;gap:14px}
.link-quiet{color:var(--muted);text-decoration:none;font-weight:600;font-size:14.5px}
.link-quiet:hover{color:var(--accent)}
.ctx{min-width:0;flex:1;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* forside */
.hero{background:var(--wash);padding-block:56px 48px}
.hero-grid{display:grid;gap:40px;align-items:center}
@media(min-width:900px){.hero-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:64px}.hero{padding-block:88px 80px}}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.display{font-size:clamp(40px,6vw,68px);line-height:1.04;font-weight:500;letter-spacing:-.025em}
.lede{font-size:18.5px;color:var(--muted);margin-top:20px;max-width:32em}
.hero-form{margin-top:34px;max-width:580px}
.hero-input-row{display:flex;gap:10px;flex-wrap:wrap}
.hero-input-row .input{flex:1 1 260px}
.hero-input-row .btn{flex:0 0 auto}
.hero-form .fine{margin-top:12px}
.demo-cap{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.demo-stack{display:grid;gap:12px}
.demo-stack .job{box-shadow:var(--shadow)}
.demo-mini{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;background:var(--surface);border:1.5px dashed var(--hidden);border-radius:var(--r-md);padding:13px 15px;font-size:14.5px}
.demo-mini b{font-weight:700}
.band{padding-block:64px}
.band h2{font-size:clamp(28px,3.6vw,40px);line-height:1.1}
.band-sub{color:var(--muted);margin-top:12px;max-width:40em;font-size:16.5px}
.steps{display:grid;gap:20px;margin-top:32px}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.step{display:grid;gap:8px;align-content:start;background:var(--surface-2);border-radius:var(--r-lg);padding:22px}
.step-n{width:32px;height:32px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;color:var(--accent);font-size:14px}
.step h3{font-size:21px}
.step p{color:var(--muted)}
.feat{display:grid;gap:16px;margin-top:32px}
@media(min-width:760px){.feat{grid-template-columns:repeat(2,minmax(0,1fr))}}
.feat-item{border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:grid;gap:8px;align-content:start}
.feat-item h3{font-size:19px}
.feat-item p{color:var(--muted);font-size:15px}
.feat-item .tag{justify-self:start}
.statement{padding-block:64px;background:var(--accent-soft)}
.statement p.big{font-family:var(--font-display);font-size:clamp(28px,4.2vw,46px);line-height:1.12;font-weight:500;letter-spacing:-.02em;max-width:22em;text-wrap:balance}
.statement p.big span{color:var(--accent)}
.statement p.small{margin-top:18px;color:var(--muted);max-width:40em}
.co-grid{display:grid;gap:28px}
@media(min-width:900px){.co-grid{grid-template-columns:minmax(0,1fr) minmax(0,420px);align-items:start}}
.co-list{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:12px}
.co-list li{display:flex;gap:10px;align-items:flex-start}
.co-list svg{width:18px;height:18px;color:var(--accent);flex:none;margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:grid;gap:14px;box-shadow:var(--shadow)}
.panel h3{font-size:20px}
.ok-note{background:var(--accent-soft);color:var(--fg);border-radius:12px;padding:11px 13px;font-size:14.5px}
.foot{padding-block:28px 48px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
.foot .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* onboarding */
.ob{min-height:100%;background:var(--wash)}
.ob-top{display:flex;align-items:center;gap:16px;min-height:68px}
.ob-progress{margin-left:auto;display:flex;gap:6px}
.ob-progress span{width:30px;height:6px;border-radius:3px;background:var(--line)}
.ob-progress span.on{background:var(--accent)}
.ob-main{max-width:640px;padding-block:28px 72px}
.ob-step{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ob-h{font-size:clamp(32px,5vw,46px);line-height:1.08;margin-top:10px}
.ob-p{color:var(--muted);font-size:17px;margin-top:12px}
.ob-body{margin-top:28px;display:grid;gap:26px}
.sugg{list-style:none;margin:10px 0 0;padding:6px;border:1px solid var(--line);border-radius:18px;background:var(--surface);display:grid;gap:2px;box-shadow:var(--shadow)}
.sugg:empty{display:none}
.sugg button{width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.sugg button:hover,.sugg button:focus-visible{background:var(--wash)}
.sugg .uni{font-size:12.5px;font-weight:700;color:var(--muted);flex:none}
.sugg .free{color:var(--accent);font-weight:700}
.ob-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fam-grid{display:grid;gap:8px}
@media(min-width:560px){.fam-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fam{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer}
.fam[aria-pressed="true"]{border-color:var(--accent)}
.fam[aria-pressed="false"]{opacity:.5;background:transparent}
.fam[aria-pressed="false"] .fam-name{text-decoration:line-through}
.fam-name{font-weight:700;font-size:14.5px;min-width:0;flex:1}
.fam-fit{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.notice{background:var(--worth-soft);border-radius:14px;padding:12px 14px;font-size:14.5px}

/* skolevalg og uddannelsesliste */
.demo-more{display:grid;gap:8px}
.demo-more-h{font-size:13px;font-weight:700;color:var(--muted)}
.school-group{display:grid;gap:10px}
.blurb{font-size:15px;color:var(--fg)}
.src{font-size:12.5px;color:var(--muted);margin-top:-4px}
.hero-schools{display:flex;flex-wrap:wrap;gap:8px}
.school-chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 18px;font-weight:800;font-size:15px;cursor:pointer;color:var(--fg)}
.school-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.school-chip.ghost{font-weight:600;color:var(--muted)}
.school-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.school-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.school{display:grid;gap:3px;align-content:start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:16px;cursor:pointer;min-width:0}
.school:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.school-abbr{font-family:var(--font-display);font-size:28px;font-weight:500;line-height:1.1;color:var(--fg)}
.school-full{font-size:13.5px;font-weight:700;color:var(--fg)}
.school-n{font-size:12.5px;color:var(--muted)}
.school-other .school-abbr{color:var(--accent)}
.prog-list{list-style:none;margin:0;padding:6px;border:1px solid var(--line);border-radius:18px;background:var(--surface);display:grid;gap:2px;max-height:420px;overflow:auto}
.prog-list button{width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;gap:12px;align-items:baseline;justify-content:space-between}
.prog-list button:hover,.prog-list button:focus-visible{background:var(--wash)}
.prog-list .pn{min-width:0;font-weight:600}
.prog-list .pl{flex:none;font-size:12px;font-weight:700;color:var(--muted)}
.prog-list .free{color:var(--accent)}
.prog-list .none{padding:10px 12px;color:var(--muted)}

/* app */
.app{background:var(--surface-2);min-height:100%}
.app-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding-block:20px 120px}
@media(min-width:900px){.app-grid{grid-template-columns:200px minmax(0,1fr);padding-block:28px 64px}}
@media(min-width:1180px){.app-grid{grid-template-columns:200px minmax(0,680px) minmax(0,1fr)}}
.rail{display:none}
@media(min-width:900px){.rail{display:grid;gap:4px;align-content:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}}
.rail button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:999px;padding:10px 14px;cursor:pointer;font-weight:700;color:var(--muted);text-align:left}
.rail button:hover{background:var(--surface);color:var(--fg)}
.rail button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.rail svg{width:18px;height:18px;flex:none}
.rail .count{margin-left:auto;font-family:var(--font-mono);font-size:12px;font-weight:500}
.side{display:none}
@media(min-width:1180px){.side{display:grid;gap:16px;align-content:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
@media(min-width:900px){.tabbar{display:none}}
.tabbar button{background:none;border:0;display:grid;justify-items:center;gap:3px;padding:9px 2px 8px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;position:relative}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar svg{width:22px;height:22px}
.tabbar .badge{position:absolute;top:5px;left:calc(50% + 8px);font-size:10px;font-weight:800;background:var(--hidden);color:var(--accent-ink);border-radius:999px;padding:0 5px;line-height:16px}
.hide-mobile{display:none}
@media(min-width:900px){.hide-mobile{display:inline-flex}}
@media(min-width:1180px){.only-narrow{display:none}}
@media(max-width:480px){.top-links .link-quiet{display:none}}
@media(max-width:440px){.why-long{display:none}.actions{gap:6px}.actions .icon-btn{width:40px;height:40px}}

.feed-col{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.h-feed{font-size:clamp(30px,4vw,38px);line-height:1.08}
.sub{color:var(--muted);margin-top:6px;font-size:15px}
.filter-note{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 16px;font-size:14.5px;color:var(--muted)}
.filter-note b{color:var(--fg);font-weight:700}
.filtered{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px 10px;font-size:14.5px;color:var(--muted)}
.fl-head{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:6px 0}
.fl-head b{color:var(--fg)}
.fl-head svg{width:18px;height:18px;transition:transform .15s}
.fl-head[aria-expanded="true"] svg{transform:rotate(180deg)}
.fl-head:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.fl-why,.fl-jobs{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.fl-why li{display:flex;align-items:center;justify-content:space-between;gap:2px 8px;flex-wrap:wrap}
.fl-why li .btn{margin-left:auto;padding-inline:0}
.fl-why b{color:var(--fg)}
.fl-jobs{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;gap:8px}
.fl-jobs li{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:center}
.fl-t{color:var(--fg);font-weight:600;grid-column:1}
.fl-s{font-size:13px;grid-column:1}
.fl-jobs .btn{grid-column:2;grid-row:1/span 2}
.cards{display:grid;gap:14px}

/* jobkort */
.job{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 20px 14px;display:grid;gap:14px;transition:opacity .25s,transform .25s}
.job.leaving{opacity:0;transform:translateX(24px)}
.job-top{display:flex;gap:13px;align-items:flex-start}
.monogram{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:14.5px;background:hsl(var(--h) var(--mono-s) var(--mono-bg-l));color:hsl(var(--h) var(--mono-s) var(--mono-fg-l));flex:none}
.job-head{min-width:0;flex:1}
.job-co{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.job-title{font-family:var(--font-display);font-size:21px;line-height:1.2;font-weight:500;letter-spacing:-.01em;margin-top:3px;text-wrap:balance}
.lvl{flex:none;display:grid;justify-items:end;gap:6px}
.lvl-pill{font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:999px;white-space:nowrap}
.lvl-strong .lvl-pill{background:var(--accent-soft);color:var(--accent)}
.lvl-good .lvl-pill{background:var(--good-soft);color:var(--good)}
.lvl-worth .lvl-pill{background:var(--worth-soft);color:var(--worth)}
.meter{display:flex;gap:4px}
.meter i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.lvl-strong .meter i{background:var(--accent)}
.lvl-good .meter i:nth-child(-n+2){background:var(--good)}
.lvl-worth .meter i:nth-child(1){background:var(--worth)}
@media(max-width:560px){.job-top{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"mono lvl" "head head";row-gap:10px}.job-top .monogram{grid-area:mono}.job-top .lvl{grid-area:lvl;align-self:center}.job-top .job-head{grid-area:head}}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag-new{background:var(--good-soft);color:var(--good)}
.tag-hidden{background:var(--hidden-soft);color:var(--hidden)}
.tag-soon{background:var(--worth-soft);color:var(--worth)}
.sponsored{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.reasons{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.reasons li{display:flex;gap:9px;align-items:flex-start;font-size:15px}
.reasons svg{flex:none;width:17px;height:17px;margin-top:3px}
.r-pos svg{color:var(--accent)}
.r-neg{color:var(--muted)}
.r-neg svg{color:var(--worth)}

function derive(name){

  for(const [re,map] of RULES){ if(re.test(t)) for(const f in map) w[f]=Math.max(w[f]||0,map[f]); }
  if(!Object.keys(w).length) return {customer:.6,operations:.55,salesops:.5,marketing:.5,bizdev:.45,hr:.45,pmo:.4};
  return w;
}
const PROGRAMS = [];
for(const s of SCHOOLS){ for(const lv in s.lists){ for(const name of s.lists[lv]){
  const k=s.key+"|"+name; const ln=name.toLowerCase(); let region=s.region;
  for(const [re,r] of CAMPUS){ if(re.test(ln)) region=r; }
  PROGRAMS.push({id:s.key+"-"+lv+"-"+norm(name).replace(/ /g,"-"),name,uni:s.key,level:lv,region,aliases:ALIASES[k]||[],w:OVERRIDE[k]||NAME_OVERRIDE[name]||derive(name)});
} } }
const progById = id => PROGRAMS.find(p=>p.id===id);
const schoolOf = k => SCHOOLS.find(s=>s.key===k);
function shortName(n){ return n.replace(/^(BSc|MSc|MSSc) in /,"").replace(/^Cand\.merc\.\s*i\s+/i,"").replace(/\s*\((København|Køge|Emdrup|Ballerup|Lyngby|Herning|Aarhus|Djursland|Nødebo|Odense|Kolding|Esbjerg|Sønderborg|Vejle|Slagelse|Aalborg)\)$/,"").trim(); }
function programsFor(uni, level, q){
  const toks=norm(q).split(" ").filter(Boolean);
  let list=PROGRAMS.filter(p=>(uni==="other"||p.uni===uni) && (level==="all"||p.level===level));
  if(toks.length) list=list.filter(p=>{ const hay=norm([p.name,...p.aliases,uni==="other"?p.uni:""].join(" ")); return toks.every(t=>hay.includes(t)); });
  const nq=norm(q);
  return list.sort((a,b)=>{ const as=nq&&norm(a.name).startsWith(nq)?0:1, bs=nq&&norm(b.name).startsWith(nq)?0:1; return (as-bs) || a.name.localeCompare(b.name,"da"); });
}
function findProgram(text, uni){
  const t=norm(text); if(!t) return null;
  const u=uni||"other";
  const pool=PROGRAMS.filter(p=>u==="other"||p.uni===u);
  const exact=pool.find(p=>norm(p.name)===t || norm(shortName(p.name))===t || p.aliases.some(a=>norm(a)===t));
  if(exact) return exact;
  const hits=programsFor(u,"all",text);
  return hits.length===1 ? hits[0] : null;
}

/* Har man flere uddannelser (fx bachelor + kandidat), tæller den bedste pasform pr. felt */
function effW(p){
  const w={...(p.weights||{})};
  for(const e of p.extra||[]) for(const f in e.weights||{}) w[f]=Math.max(w[f]||0,e.weights[f]);
  return w;
}
/* Felter, man har erfaring i: fra CV'et og fra de tidligere job, man selv har skrevet */
function famsFromText(t){

/* AI-agentens vurdering: hvilke uddannelser jobbet passer til (sat af jobindsamleren, når AI er slået til) */
function studyHay(p){
  const prog=p.programId?progById(p.programId):null;
  return " "+norm([p.programName,p.studyText,...(prog?prog.aliases:[]),...(p.extra||[]).map(e=>e.name)].join(" "))+" ";
}
function aiFits(job, p){
  if(!job.studies || !job.studies.length) return null;
  const hay=studyHay(p); const words=hay.split(" ").filter(w=>w.length>=5);
  return job.studies.some(t=>{ const n=norm(t); return n && (hay.includes(" "+n+" ") || hay.includes(n) && n.length>=5 || words.some(w=>n.split(" ").includes(w))); });
}
function expFams(p){ return [...new Set([...(p.cvFams||[]),...(p.pastJobs||[]).flatMap(famsFromText)])].filter(f=>FAM[f]); }
function ctxOf(c){ return c || {profile:S.profile, learned:S.learned, disabled:S.disabled}; }
/* Job, der kun er for studerende på en bestemt uddannelse (sat af jobindsamleren) */
const REQ_STUDY = {
  jura:/jura|\bjur\b|\blaw\b|erhvervsjura|retsvidenskab/, sygepleje:/sygepleje|nursing/, medicin:/(^| )medicin( |$)|medicine|læge/,
  farmaci:/farmaci|pharma/, psykologi:/psykolog/, paedagog:/pædagog/, socialraadgiver:/socialrådgiv|socialt arbejde/,
  tandpleje:/tandpleje|odontologi|tandlæge/, audiologopaedi:/audiologopædi/, arkitekt:/arkitekt/, konstruktoer:/konstruktør|byggeri/,
  ingenioer:/ingeniør|engineering|byggeri|bygning|konstruktion|maskin|elektro|anlæg|civil|kemiteknik|teknologi/,
  maritim:/maskinmester|skibsfører|skibsofficer|maritim/, oekonomi:/økonomi|economics|polit/
};
function studyFits(req, p){
  const rx = REQ_STUDY[req]; if(!rx) return true;
  const prog = p.programId ? progById(p.programId) : null;
  const hay = norm([p.programName, p.studyText, ...(prog ? prog.aliases : []), ...(p.extra||[]).map(e=>e.name)].join(" "));
  if(req==="ingenioer" && /global business/.test(hay)) return false;  /* GBE er ikke en teknisk ingeniøruddannelse i denne forstand */
  return rx.test(hay);
}
function evaluate(job, c){
  c=ctxOf(c); const p=c.profile, W=effW(p);
  if(job.req && !studyFits(job.req, p)) return {out:"study"};
  if(c.disabled.includes(job.fam)) return {out:"field"};
  if(job.danish==="required" && p.danish!=="fluent") return {out:"danish"};
  if(job.hMin > p.hoursMax+2) return {out:"hours"};
  const jr=area(job.region); if(!p.regions.includes("any") && jr!=="remote" && jr!=="dk" && !p.regions.map(area).includes(jr)) return {out:"location"};
  const prim = W[job.fam]||0;
  let bestSec={f:null,w:0};
  for(const f of job.sec||[]){ const w=(W[f]||0)*.85; if(w>bestSec.w) bestSec={f,w}; }
  /* Er feltet kun gættet ud fra opslagets tekst (ikke titlen), stoler vi mindre på det */
  let degree = Math.max(prim,bestSec.w) * (job.famConf==="text" ? .7 : 1);
  /* Agenten og reglerne stemmer sammen: siger AI'en, at jobbet passer til uddannelsen, løftes det; ellers dæmpes det lidt */
  const ai = aiFits(job,p);
  if(ai===true) degree=Math.max(degree,.8);
  else if(ai===false && !job.openToAll) degree*=.85;
  const secs=job.sec||[];
  const learnedAdj = (c.learned[job.fam]||0) + (secs.length ? .4*secs.reduce((s,f)=>s+(c.learned[f]||0),0)/secs.length : 0);
  const affinity = clamp(degree+learnedAdj,0,1);
  const comps=[{k:"degree",label:"Uddannelse",v:affinity,w:.55}];
  let skillHits=[];
  if(p.skills.length){
    skillHits = job.skills.filter(s=>p.skills.some(u=>norm(u)===norm(s)));
    comps.push({k:"skills",label:"Kompetencer",v:.35+.65*Math.min(1,skillHits.length/Math.min(3,job.skills.length)),w:.25});
  } else comps.push({k:"skills",label:"Kompetencer",v:null,w:.25});
  let interestHit=null;
  if(p.interests.length || p.industries.length){
    let v=.5;
    if(p.interests.includes(job.fam)){ v=1; interestHit=job.fam; }
    else { const s=secs.find(f=>p.interests.includes(f)); if(s){ v=.6; interestHit=s; } }
    if(p.industries.includes(job.industry)){ v=Math.max(v,.8); if(!interestHit) interestHit="ind:"+job.industry; }
    comps.push({k:"interest",label:"Interesser",v,w:.2});
  } else comps.push({k:"interest",label:"Interesser",v:null,w:.2});
  const xf=expFams(p); let expHit=null;
  /* Erfaring kan kun løfte et job: uden match tæller den slet ikke med */
  if(xf.includes(job.fam)) expHit=job.fam; else expHit=secs.find(f=>xf.includes(f))||null;
  comps.push({k:"exp",label:"Erfaring",v:expHit?(expHit===job.fam?1:.8):null,w:.15});
  const live=comps.filter(x=>x.v!==null); const wsum=live.reduce((s,x)=>s+x.w,0);
  let score = live.reduce((s,x)=>s+x.v*x.w,0)/wsum;
  if(job.postedH<12) score+=.03;
  if(job.danish==="plus" && p.danish!=="fluent") score-=.05;
  if(job.hMax>p.hoursMax) score-=.04;
  score=clamp(score,0,1);
  /* Uden reel faglig sammenhæng vises jobbet ikke, uanset timer og interesser */
  const level = affinity<.45 ? null : score>=.72 ? "strong" : score>=.55 ? "good" : score>=.4 ? "worth" : null;
  const vocab=[]; for(const f in W){ if(W[f]>=.6) vocab.push(...(TITLE_KW[f]||[])); }
  const title=" "+job.title.toLowerCase()+" ";
  const obvious = vocab.some(k=>title.includes(k));
  const hidden = !obvious && affinity>=.55 && score>=.5;
  return {score,level,prim,bestSec,affinity,learnedAdj,skillHits,interestHit,expHit,ai,comps,hidden};
}
function reasonsFor(job, ev, c){
  c=ctxOf(c); const p=c.profile; const pos=[], neg=[]; const pname=p.programShort||p.programName||"din uddannelse";
  if(ev.ai===true && job.why) pos.push(job.why);
  else if(ev.prim>=.6) pos.push(p.guessed ? `${FAM[job.fam].label} passer til det, du har fortalt om dit studie` : `${FAM[job.fam].label} er et oplagt felt for ${pname}`);
  else if(ev.bestSec.f && ev.bestSec.w>=.45) pos.push(`Arbejdet er i høj grad ${FAM[ev.bestSec.f].n}, som passer til ${pname}`);
  else if(ev.prim>=.4) pos.push(`Beslægtet med ${pname}`);
  if(ev.skillHits.length) pos.push(`Du har ${listJoin(ev.skillHits)}`);
  if(ev.expHit) pos.push(`Du har erfaring med ${FAM[ev.expHit].n}`);
  if(ev.interestHit){ pos.push(ev.interestHit.startsWith("ind:") ? `Inden for ${ev.interestHit.slice(4).toLowerCase()}, en branche du har valgt` : `Matcher din interesse for ${FAM[ev.interestHit].n}`); }
  const l=c.learned[job.fam]||0;
  if(l>=.1) pos.push(`Du har tidligere vist interesse for ${FAM[job.fam].n}`);
  if(job.danish==="no" && p.danish!=="fluent") pos.push("Arbejdssproget er engelsk");
  if(job.postedH<12) pos.push(`Slået op ${ago(job.postedH)}, så du er tidligt ude`);
  if(job.danish==="plus" && p.danish!=="fluent") neg.push("Dansk er et plus her");
  if(job.hMax>p.hoursMax) neg.push(`Op til ${job.hMax} timer om ugen, mere end dine ${hoursText(p.hoursMax).replace(" t"," timer")}`);
  if(job.deadline!=null && job.deadline<=5) neg.push(`Ansøgningsfrist om ${job.deadline} dage`);
  if(p.skills.length && !ev.skillHits.length) neg.push(`Efterspørger ${job.skills[0]}, som ikke står på din profil`);
  if(l<=-.1) neg.push(`Du har tidligere fravalgt ${FAM[job.fam].n}`);
  return {pos:pos.slice(0,3),neg:neg.slice(0,2)};
}
function hiddenWhy(job, ev, c){
  c=ctxOf(c); const pname=c.profile.programShort||"din uddannelse";
  const work=[job.fam,...(job.sec||[])].filter(f=>(effW(c.profile)[f]||0)>=.5).slice(0,2).map(f=>FAM[f].n);
  const t=job.title.replace(/^Studentermedhjælper – /,"");
  return `“${t}” bruger ikke de ord, du ville søge på som ${pname}-studerende, men arbejdet er i praksis ${work.length?listJoin(work):"tæt på dit felt"}.`;
}
function allEvals(){ return JOBS.map(j=>({job:j,ev:evaluate(j)})); }
function fbOf(id){ return S.fb[id] || (S.fb[id]={}); }
function feed(){
  let items = allEvals().filter(x=>!x.ev.out && x.ev.level && !(S.fb[x.job.id]||{}).dismissed && !(S.fb[x.job.id]||{}).applied);
  items = items.filter(x=>!x.job.sponsored || x.ev.score>=.55);
  items.sort((a,b)=>b.ev.score-a.ev.score);
  const out=[];
  while(items.length){
    const recent=out.slice(-2).map(x=>x.job.fam);
    let idx=0;
    if(recent.length===2 && recent[0]===recent[1]){
      const alt=items.findIndex(x=>x.job.fam!==recent[0] && x.ev.score>=items[0].ev.score-.08);
      if(alt>0) idx=alt;
    }
    out.push(items.splice(idx,1)[0]);
  }
  return out;
}
function hiddenFeed(){ return feed().filter(x=>x.ev.hidden); }
function filteredCounts(){
  const c={danish:0,hours:0,location:0,field:0,study:0,dismissed:0};
  for(const x of allEvals()){ if((S.fb[x.job.id]||{}).dismissed) c.dismissed++; else if(x.ev.out) c[x.ev.out]++; }
  return c;
}
/* Alle job, der ikke vises, med grunden */
function filteredJobs(){
  return allEvals().map(x=>({...x,why:(S.fb[x.job.id]||{}).dismissed?"dismissed":x.ev.out})).filter(x=>x.why);
}

const root=typeof document!=="undefined" ? document.getElementById("root") : null;
function render(){
  if(S.view==="app" && !S.onboarded) S.view="landing";
  root.innerHTML = S.view==="landing" ? vLanding()+sheetHTML() : S.view==="onboard" ? vOnboard()+sheetHTML() : vApp();

  if(UI.focus){ const el=document.getElementById(UI.focus); if(el){ el.focus(); if(el.setSelectionRange && el.value!=null){ const n=el.value.length; try{el.setSelectionRange(n,n);}catch(e){} } } UI.focus=null; }
}
function commit(){ persist(); render(); }
let toastTimer=null;
function toast(msg, undo){
  const t=document.getElementById("toast");
  t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">Fortryd</button>':""}`;
  t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),4200);
}
function snap(){ snapshot=JSON.stringify({learned:S.learned,fb:S.fb}); }
function bump(f,d){ S.learned[f]=Math.round(clamp((S.learned[f]||0)+d,-.6,.4)*100)/100; }

/* ============ HANDLINGER ============ */
function act(a, el){
  const id=el.dataset.id, v=el.dataset.v, p=S.profile;
  switch(a){
    case "home": S.view="landing"; window.scrollTo(0,0); return commit();
    case "start":
      if(S.onboarded){ S.view="app"; S.tab="foryou"; }
      else { S.view="onboard"; S.step=1; }
      window.scrollTo(0,0); return commit();
    case "school": S.view="onboard"; S.step=2; UI.obUni=v; UI.obLevel="all"; UI.obText=""; UI.focus="ob-study"; window.scrollTo(0,0); return commit();
    case "level": UI.obLevel=v; return render();
    case "pick": setProgram(progById(id)); S.step=3; window.scrollTo(0,0); return commit();
    case "use-text": setFreeText(UI.obText, UI.obUni); S.step=3; window.scrollTo(0,0); return commit();
    case "danish": p.danish=v; return commit();
    case "hours": p.hoursMax=Number(v); return commit();
    case "region":
      if(v==="any") p.regions=["any"];
      else { p.regions=p.regions.filter(r=>r!=="any"); p.regions = p.regions.includes(v) ? p.regions.filter(r=>r!==v) : [...p.regions,v]; if(!p.regions.length) p.regions=[v]; }
      return commit();
    case "ob-next": S.step=Math.min(4,S.step+1); window.scrollTo(0,0); return commit();
    case "ob-back": S.step=Math.max(1,S.step-1); if(S.step===2){ UI.obUni=p.uniKey||UI.obUni||"other"; UI.obText=""; UI.obLevel="all"; } window.scrollTo(0,0); return commit();
    case "fam-toggle": S.disabled = S.disabled.includes(v) ? S.disabled.filter(f=>f!==v) : [...S.disabled,v]; return commit();
    case "finish": S.onboarded=true; S.view="app"; S.tab="foryou"; window.scrollTo(0,0); track("onboarded",{label:p.programName}); return commit();
    case "tab": S.tab=el.dataset.tab; UI.confirmDelete=false; window.scrollTo(0,0); return commit();
    case "why": UI.expanded[id]=!UI.expanded[id]; return render();
    case "like": { const j=byId(id), fb=fbOf(id); snap();
      if(fb.liked){ fb.liked=false; bump(j.fam,-.12); (j.sec||[]).forEach(f=>bump(f,-.04)); commit(); return toast("Fjernet fra interesseret"); }
      track("like",{jobId:id,label:jobLabel(j)}); fb.liked=true; bump(j.fam,.12); (j.sec||[]).forEach(f=>bump(f,.04)); commit(); return toast(`Noteret. Flere job inden for ${FAM[j.fam].n} fremover.`,true); }
    case "save": { const j=byId(id), fb=fbOf(id); snap();
      if(fb.saved){ fb.saved=false; bump(j.fam,-.05); commit(); return toast("Fjernet fra Gemt",true); }
      track("save",{jobId:id,label:jobLabel(j)}); fb.saved=true; bump(j.fam,.05); commit(); return toast("Gemt. Du finder det under Gemt.",true); }
    case "unsave": { const fb=fbOf(id); snap(); fb.saved=false; fb.applied=false; commit(); return toast("Fjernet",true); }
    case "dismiss": UI.sheet={type:"dismiss",id}; return render();
    case "apply": UI.sheet={type:"apply",id}; return render();
    case "close-sheet": UI.sheet=null; return render();
    case "reason": { const jid=UI.sheet.id; const j=byId(jid); snap(); UI.sheet=null;
      const fb=fbOf(jid); fb.dismissed=v; track("dismiss",{jobId:jid,label:jobLabel(j)});
      let msg="Skjult.";
      if(v==="field"){ bump(j.fam,-.2); (j.sec||[]).forEach(f=>bump(f,-.05)); msg=`Skjult. Færre job inden for ${FAM[j.fam].n} fremover.`; }
      else if(v==="hours") msg="Skjult. Tip: angiv dine timer under Profil, så frasorterer vi dem.";
      else if(v==="danish") msg="Skjult. Tip: angiv dit dansk-niveau under Profil.";
      else if(v==="location") msg="Skjult. Tip: ret dit område under Profil.";
      else if(v==="other") bump(j.fam,-.05);
      const card=document.getElementById("card-"+jid);
      if(card){ card.classList.add("leaving"); setTimeout(commit,220); } else commit();
      return toast(msg,true); }
    case "apply-go": { const jid=UI.sheet.id; const j=byId(jid); snap(); const fb=fbOf(jid); fb.applied=true; bump(j.fam,.15); UI.sheet=null; commit(); return toast("Markeret som søgt. Du finder det under Gemt.",true); }
    case "undo": if(snapshot){ const s=JSON.parse(snapshot); S.learned=s.learned; S.fb=s.fb; snapshot=null; commit(); document.getElementById("toast").classList.remove("show"); } return;
    case "reset-learning": snap(); S.learned={}; commit(); return toast("Læringen er nulstillet til din uddannelses udgangspunkt.",true);
    case "widen": p.regions=["any"]; commit(); return toast("Viser nu job fra hele landet.");
    case "alerts": p.alerts=!p.alerts; return commit();
    case "freq": p.alertFreq=v; return commit();
    case "interest": p.interests = p.interests.includes(v) ? p.interests.filter(x=>x!==v) : [...p.interests,v]; return commit();
    case "industry": p.industries = p.industries.includes(v) ? p.industries.filter(x=>x!==v) : [...p.industries,v]; return commit();
    case "skill-add": if(!p.skills.includes(v)) p.skills.push(v); return commit();
    case "list-remove": p[el.dataset.list].splice(Number(el.dataset.i),1); return commit();
    case "delete-ask": UI.confirmDelete=true; return render();
    case "delete-no": UI.confirmDelete=false; return render();
    case "delete-yes": (async()=>{ if(ACC.user){ const r=await api("me",undefined,"DELETE"); if(!r.ok) return toast(r.data.error||"Det lykkedes ikke. Prøv igen."); ACC.user=null; }
      S=fresh(); UI.confirmDelete=false; UI.expanded={}; try{localStorage.removeItem(KEY);}catch(e){} window.scrollTo(0,0); render(); toast("Dine data er slettet."); })(); return;
    case "auth": UI.sheet={type:"auth",mode:v||"signup"}; UI.focus=v==="login"?"au-mail":"au-name"; return render();
    case "auth-mode": saveAuthFields(); UI.sheet={type:"auth",mode:v}; return render();
    case "pw-sheet": UI.sheet={type:"password"}; UI.focus="pw-old"; return render();
    case "logout": (async()=>{ await api("auth/logout",{}); ACC.user=null; S=fresh(); try{localStorage.removeItem(KEY);}catch(e){} window.scrollTo(0,0); render(); toast("Du er logget ud."); })(); return;
    case "nudge-close": S.nudgeClosed=true; return commit();
    case "toggle-filtered": UI.showFiltered=!UI.showFiltered; return render();
    case "fields-on": S.disabled=[]; commit(); return toast("Alle felter er slået til igen.");
    case "undismiss": for(const k in S.fb) if(S.fb[k].dismissed) delete S.fb[k].dismissed; commit(); return toast("De fravalgte job vises igen.");
    case "undismiss-one": if(S.fb[id]) delete S.fb[id].dismissed; commit(); return toast("Jobbet vises igen.");
    case "program-sheet": UI.sheet={type:"program",mode:v||"replace",uni:p.uniKey||"other",q:""}; UI.focus="ps-q"; return render();
    case "ps-uni": UI.sheet.uni=v; UI.focus="ps-q"; return render();
    case "ps-pick": case "ps-text": { const sh=UI.sheet; const prog=a==="ps-pick"?progById(id):null; if(!prog && !sh.q.trim()) return;
      UI.sheet=null;
      if(sh.mode==="add") return addExtra(programEntry(prog, sh.q, sh.uni));
      if(prog) setProgram(prog,true); else setFreeText(sh.q, sh.uni, true);
      track("program_changed",{label:p.programName}); commit(); return toast(`Matcher nu som ${p.programName}${p.uni?" ("+p.uni+")":""}.`); }
    case "edu-primary": makePrimary(Number(el.dataset.i)); S.disabled=[]; commit(); return toast(`${p.programName} er nu din primære uddannelse.`);
    case "edu-remove": { const e=p.extra.splice(Number(el.dataset.i),1)[0]; commit(); return toast(`${e.name} er fjernet.`); }
    case "cv-pick": { const k=el.dataset.k, i=Number(el.dataset.i); UI.sheet.pick[k][i]=!UI.sheet.pick[k][i]; return render(); }
    case "cv-apply": return applyCV();
    case "cv-remove": (async()=>{ if(ACC.user) await api("me/cv",undefined,"DELETE"); p.cvName=""; p.cvAt=0; p.cvBy=""; p.cvFams=[]; commit(); toast("CV'et er fjernet. Kompetencer og job, du har tilføjet, bliver på profilen."); })(); return;
  }
}

async function cvText(file){
  const name=file.name.toLowerCase();
  if(name.endsWith(".pdf")){
    const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    await loadScript(base+"pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js";
    const doc=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; let out="";
    for(let i=1;i<=Math.min(doc.numPages,6);i++){ const c=await (await doc.getPage(i)).getTextContent(); out+=c.items.map(it=>it.str+(it.hasEOL?"\n":" ")).join("")+"\n"; }
    return out;
  }
  if(name.endsWith(".docx")){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    return (await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value;
  }
  if(name.endsWith(".txt")) return await file.text();
  throw new Error("Vi kan læse PDF, Word (.docx) og tekstfiler. Gem dit CV som PDF og prøv igen.");
}
function cvLocal(text){
  const vocab=[...new Set([...SKILLS_COMMON,...CV_SKILLS,...JOBS.flatMap(j=>j.skills||[])])].filter(v=>v.length>1);
  const low=" "+text.toLowerCase().replace(/\s+/g," ")+" ";
  const skills=vocab.filter(v=>new RegExp(`(^|[^a-zæøå0-9])${v.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}($|[^a-zæøå0-9])`).test(low)).slice(0,15);
  const lines=text.split(/\n+/).map(l=>l.replace(/\s+/g," ").trim()).filter(l=>l.length>=8 && l.length<=140);
  const edu=/uddannelse|bachelor|kandidat|gymnasi|\bhf\b|\bstx\b|\bhhx\b|\bhtx\b|universit|university|education|folkeskole|efterskole|student fra/i;
  const experience=lines.filter(l=>/(19|20)\d{2}/.test(l) && !edu.test(l)).slice(0,8).map(l=>({title:l, org:"", years:"", fams:famsFromText(l)}));
  return {skills, experience, interests:[], summary:"", by:"local"};
}
async function handleCV(file){
  if(!file) return;
  UI.cvBusy=true; render();
  try{
    const text=(await cvText(file)).trim();
    if(text.length<40) throw new Error("Vi kunne ikke finde tekst i filen. Er det et scannet billede? Prøv en PDF, der er gemt fra Word eller Google Docs.");
    let ex=cvLocal(text);
    if(ACC.user){ const r=await api("me/cv",{name:file.name,text}); if(r.ok && r.data.extract){ const a=r.data.extract; ex={...a, skills:[...new Set([...a.skills,...ex.skills])].slice(0,15)}; } }
    UI.sheet={type:"cv", name:file.name, ex, pick:{skills:ex.skills.map(()=>true), experience:ex.experience.map(()=>true), interests:ex.interests.map(()=>true)}};
    track("cv_added");
  }catch(e){ toast(e.message||"CV'et kunne ikke læses."); }
  UI.cvBusy=false; render();
}
function expLabel(e){ return [e.title, e.org].filter(Boolean).join(", ")+(e.years?` (${e.years})`:""); }
function applyCV(){
  const sh=UI.sheet, p=S.profile, ex=sh.ex;
  ex.skills.forEach((v,i)=>{ if(sh.pick.skills[i] && !p.skills.some(s=>norm(s)===norm(v))) p.skills.push(v); });
  const fams=new Set(p.cvFams||[]);
  ex.experience.forEach((e,i)=>{ if(!sh.pick.experience[i]) return; const l=expLabel(e); if(!p.pastJobs.includes(l)) p.pastJobs.push(l); (e.fams||[]).forEach(f=>fams.add(f)); });
  ex.interests.forEach((f,i)=>{ if(sh.pick.interests[i] && !p.interests.includes(f)) p.interests.push(f); });
  p.cvFams=[...fams]; p.cvName=sh.name; p.cvAt=Date.now(); p.cvBy=ex.by;
  UI.sheet=null; commit(); toast("Dit CV er brugt. Dine matches er opdateret.");
}
function saveAuthFields(){ const g=id=>document.getElementById(id); if(g("au-mail")) UI.auth.email=g("au-mail").value; if(g("au-name")) UI.auth.name=g("au-name").value; if(g("au-consent")) UI.auth.consent=g("au-consent").checked; }
async function submitAuth(form){
  saveAuthFields(); const sh=UI.sheet; const pw=form.querySelector("#au-pw").value; const signup=sh.mode!=="login";
  if(signup && !UI.auth.consent){ sh.err="Sæt flueben ved privatlivspolitikken for at oprette en bruger."; return render(); }
  sh.busy=true; sh.err=""; render();
  const r = signup ? await api("auth/signup",{email:UI.auth.email,password:pw,name:UI.auth.name,consent:true,profile:S.onboarded?S.profile:null,state:S.onboarded?serverState():null})
                   : await api("auth/login",{email:UI.auth.email,password:pw});
  sh.busy=false;
  if(!r.ok){ sh.err=r.data.error||"Det lykkedes ikke. Prøv igen."; return render(); }
  ACC.user=r.data.user; UI.sheet=null; UI.auth={email:"",name:"",consent:false};
  if(!signup) applyServer(r.data);
  if(ACC.user.mustChangePassword) UI.sheet={type:"password",forced:true};
  render(); toast(signup?"Din bruger er oprettet. Din profil gemmes nu automatisk.":`Velkommen tilbage${ACC.user.name?", "+ACC.user.name:""}.`);
}
async function submitPassword(form){
  const sh=UI.sheet; const old=form.querySelector("#pw-old"); const pw=form.querySelector("#pw-new").value;
  const r=await api("me/password",{current:old?old.value:"",password:pw});
  if(!r.ok){ sh.err=r.data.error||"Det lykkedes ikke."; return render(); }
  if(ACC.user) ACC.user.mustChangePassword=false; UI.sheet=null; render(); toast("Din adgangskode er gemt.");
}
function canonicalSkill(s){ const t=s.trim(); const hit=SKILLS_COMMON.find(x=>norm(x)===norm(t)); return hit||t; }
function onSubmit(form){
  const k=form.dataset.form, p=S.profile;
  if(k==="ob-prog"){ const t=UI.obText.trim(); if(!t) return; const m=findProgram(t, UI.obUni)||programsFor(UI.obUni, UI.obLevel, t)[0]; if(m) setProgram(m); else setFreeText(t, UI.obUni); S.step=3; window.scrollTo(0,0); return commit(); }
  if(k==="waitlist"){ const g=id=>form.querySelector(id).value.trim();
    api("waitlist",{company:g("#wl-co"),name:g("#wl-name"),email:g("#wl-mail"),message:g("#wl-msg")}).then(r=>{
      if(r.ok || r.status===503){ UI.waitlistDone=true; UI.waitlistErr=""; } else UI.waitlistErr=r.data.error||"Det lykkedes ikke. Skriv til matchstudie@gmail.com.";
      render(); }); return; }
  if(k==="auth") return submitAuth(form);
  if(k==="password") return submitPassword(form);
  if(k==="study"){ const t=form.querySelector("#pf-study").value.trim(); if(!t) return; const uni=(document.getElementById("pf-uni")||{}).value||"other"; const m=findProgram(t, uni)||programsFor(uni,"all",t)[0]; if(m) setProgram(m,true); else setFreeText(t, uni, true); UI.pfUni=null; commit(); return toast(`Matcher nu som ${p.programName}${p.uni?" ("+p.uni+")":""}.`); }
  if(k==="skill"){ const inp=form.querySelector("input"); const t=canonicalSkill(inp.value); if(t && !p.skills.some(s=>norm(s)===norm(t))) p.skills.push(t); UI.focus="pf-skill"; return commit(); }
  if(k==="pastJobs"||k==="courses"){ const inp=form.querySelector("input"); const t=inp.value.trim(); if(t) p[k].push(t); UI.focus=inp.id; return commit(); }
}
if(typeof document!=="undefined"){
  document.addEventListener("click",e=>{
    const el=e.target.closest("[data-act]");
    if(!el) return;
    if(el.dataset.act==="close-sheet" && e.target.closest("[data-stop]") && el.classList.contains("scrim")) return;
    if(el.tagName==="A") return;
    e.preventDefault(); act(el.dataset.act, el);
  });
  document.addEventListener("click",e=>{ const a=e.target.closest("a[data-track]"); if(a) track("apply_click",{jobId:a.dataset.id,label:jobLabel(byId(a.dataset.id))}); }, true);
  document.addEventListener("submit",e=>{ e.preventDefault(); onSubmit(e.target); });
  document.addEventListener("input",e=>{
    if(e.target.id==="hero-study") UI.heroText=e.target.value;
    if(e.target.id==="ps-q" && UI.sheet && UI.sheet.type==="program"){ UI.sheet.q=e.target.value; const l=document.getElementById("ps-list"); if(l) l.innerHTML=psListHTML(); }
    if(e.target.id==="ob-study"){ UI.obText=e.target.value; const l=document.getElementById("prog-list"); if(l) l.innerHTML=progListHTML(); const c=document.getElementById("prog-count"); if(c) c.textContent=progCount(); const b=document.getElementById("ob-go"); if(b) b.disabled=!norm(UI.obText); }
  });
  document.addEventListener("change",e=>{
    const k=e.target.dataset.change; if(!k) return; const p=S.profile;
    if(k==="pf-uni"){ UI.pfUni=e.target.value; return render(); }
    if(k==="semester") p.semester=e.target.value;
    if(k==="email") p.email=e.target.value.trim();
    if(k==="cv"){ const f=e.target.files&&e.target.files[0]; return handleCV(f); }
    commit();
  });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && UI.sheet && !UI.sheet.forced){ UI.sheet=null; render(); } });
  render();
  loadLiveJobs();
  initAccount();
}
/* Henter rigtige job fra data/jobs.json, som jobindsamleren skriver. Findes filen ikke, vises eksempeljob. */
async function loadLiveJobs(){
  try{
    const res = await fetch("data/jobs.json",{cache:"no-store"});
    if(!res.ok) return;
    const data = await res.json();
    if(!Array.isArray(data) || !data.length) return;
    const t = Date.now();
    const live = data.filter(j=>j && j.title && j.id && FAM[j.fam]).map(j=>({...j,
      sec:(j.sec||[]).filter(f=>FAM[f]), skills:j.skills||[], hMin:j.hMin||0, hMax:j.hMax||0,
      postedH: j.postedAt ? Math.max(0,Math.round((t-Date.parse(j.postedAt))/36e5)) : 999,
      deadline: j.rolling ? null : j.deadlineAt ? Math.max(0,Math.ceil((Date.parse(j.deadlineAt)-t)/864e5)) : null,
      industry: j.industry||"Andet", live:true}));
    if(!live.length) return;
    JOBS.length=0; JOBS.push(...live);
    INDUSTRIES.length=0; INDUSTRIES.push(...[...new Set(JOBS.map(j=>j.industry))].sort((a,b)=>a.localeCompare(b,"da")));
    LIVE=true; render();
  }catch(e){}
}
