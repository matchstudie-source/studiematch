<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Studiematch finder studiejob, der passer til din uddannelse. Gratis for studerende i Danmark.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="canonical" href="https://studiematch.dk/">
<title>Studiematch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: luftig app-skal. Desktop = navigation til venstre + feed (maks. 680px) + læringspanel (>=1180px). Mobil = én kolonne + fanebjælke i bunden. Bevidst ét lyst udtryk. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --wash:#F4F5F3; --surface:#FFFFFF; --surface-2:#F4F5F3; --fg:#1A1D1C; --muted:#5D6562; --line:#DFE2E0; --line-2:#C9CECB;
  --accent:#0B7D60; --accent-ink:#FFFFFF; --accent-soft:#E8F3EF; --accent-deep:#075E48;
  --good:#2F5E9E; --good-soft:#EBF0F7; --worth:#8A5800; --worth-soft:#FBF3E1;
  --hidden:#7A4A9E; --hidden-soft:#F3EEF8; --warn:#B23A2C; --warn-soft:#FBEDEB;
  --sun:#FFE073; --toast-bg:#1A1D1C; --toast-fg:#FFFFFF;
  --scrim:rgba(26,29,28,.32); --shadow:0 1px 2px rgba(26,29,28,.05),0 8px 24px rgba(26,29,28,.07);
  --mono-s:62%; --mono-bg-l:93%; --mono-fg-l:30%; --knob:#FFFFFF;
  --font-display:"Schibsted Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-body:"Schibsted Grotesk","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;
  --r-sm:6px; --r-md:8px; --r-lg:10px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.02em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{width:100%;max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}
.hl{background:linear-gradient(transparent 60%,var(--sun) 60%,var(--sun) 90%,transparent 90%);padding:0 .05em}

/* knapper og felter */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-sm);border:1px solid transparent;font-weight:600;cursor:pointer;padding:10px 18px;font-size:15px;line-height:1.2;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-deep)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;filter:none}
.btn-ghost{background:var(--surface);border-color:var(--line-2);color:var(--fg)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-quiet{background:transparent;color:var(--accent);padding:8px 8px}
.btn-sm{padding:7px 14px;font-size:14px}
.btn-lg{padding:14px 24px;font-size:16px}
.input,.select{width:100%;font-family:inherit;resize:vertical;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:11px 14px;font-size:15.5px;min-width:0}
.input:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input-lg{padding:14px 16px;font-size:16.5px}
.label{display:block;font-weight:600;font-size:14.5px;margin-bottom:8px}
.fine{font-size:13.5px;color:var(--muted)}
.region-group{margin:10px 0 6px;font-weight:600}
.region-any{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:7px 12px;font-size:14px;cursor:pointer;font-weight:500;color:var(--fg)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:#fff}
.chip .x{opacity:.6}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.seg .chip{justify-content:center;padding:10px 6px;text-align:center}

/* topbjælke */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:16px;min-height:64px}
.logo{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.03em;color:var(--fg);background:none;border:0;cursor:pointer;padding:0;flex:none}
.logo-mark{width:28px;height:28px;display:block;flex:none}
.logo-mark svg{width:100%;height:100%;display:block}
.top-links{margin-left:auto;display:flex;align-items:center;gap:14px}
.link-quiet{color:var(--fg);text-decoration:none;font-weight:500;font-size:14.5px}
.link-quiet:hover{color:var(--accent)}
.lang-btn{font-weight:600}
.lang-btn .l-short{display:none}
@media(max-width:480px){.lang-btn .l-long{display:none}.lang-btn .l-short{display:inline}.lang-btn{padding-inline:6px}.top-links{gap:4px}.top-links .btn-primary{padding-inline:12px}}
.ob-right{display:flex;align-items:center;gap:14px;margin-left:auto}
.ctx{min-width:0;flex:1;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* forside */
.hero{background:var(--bg);padding-block:48px 56px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;gap:40px;align-items:center}
@media(min-width:900px){.hero-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:72px;align-items:start}.hero{padding-block:80px 88px}}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.display{font-size:clamp(38px,5.4vw,64px);line-height:1.02;font-weight:800;letter-spacing:-.04em;max-width:11em}
.lede{font-size:18px;color:var(--muted);margin-top:20px;max-width:30em}
.hero-form{margin-top:40px;max-width:560px}
.hero-input-row{display:flex;gap:10px;flex-wrap:wrap}
.hero-input-row .input{flex:1 1 260px}
.hero-input-row .btn{flex:0 0 auto}
.hero-form .fine{margin-top:12px}
.demo-cap{font-size:14px;color:var(--muted);margin-bottom:14px;max-width:34em}
.demo-stack{display:grid;gap:12px}
.demo-stack .job{box-shadow:var(--shadow);border-color:var(--line-2)}
.demo-mini{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;background:var(--surface);border:1.5px dashed var(--hidden);border-radius:var(--r-md);padding:13px 15px;font-size:14.5px}
.demo-mini b{font-weight:700}
.band{padding-block:72px}
.band h2{font-size:clamp(26px,3.2vw,36px);line-height:1.1;letter-spacing:-.03em}
.band-sub{color:var(--muted);margin-top:12px;max-width:40em;font-size:16.5px}
.steps{display:grid;gap:28px;margin-top:36px;counter-reset:st}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}}
.step{display:grid;gap:8px;align-content:start;border-top:2px solid var(--fg);padding-top:16px}
.step-n{font-weight:700;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.step h3{font-size:19px;letter-spacing:-.015em}
.step p{color:var(--muted)}
.feat{display:grid;gap:0 48px;margin-top:28px}
@media(min-width:760px){.feat{grid-template-columns:repeat(2,minmax(0,1fr))}}
.feat-item{border-top:1px solid var(--line);padding:22px 0 26px;display:grid;gap:6px;align-content:start}
.feat-item h3{font-size:18px;letter-spacing:-.01em}
.feat-item p{color:var(--muted);font-size:15px}
.feat-item .tag{justify-self:start}
.statement{padding-block:64px;background:var(--accent-soft)}
.statement p.big{font-family:var(--font-display);font-size:clamp(28px,4.2vw,46px);line-height:1.12;font-weight:500;letter-spacing:-.02em;max-width:22em;text-wrap:balance}
.statement p.big span{color:var(--accent)}
.statement p.small{margin-top:18px;color:var(--muted);max-width:40em}
.co-grid{display:grid;gap:28px}
@media(min-width:900px){.co-grid{grid-template-columns:minmax(0,1fr) minmax(0,420px);align-items:start}}
.co-list{list-style:none;padding:0;margin:22px 0 26px;display:grid;gap:12px}
.co-list li{display:flex;gap:10px;align-items:flex-start}
.co-list svg{width:18px;height:18px;color:var(--accent);flex:none;margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:24px;display:grid;gap:14px}
.panel h3{font-size:20px}
.ok-note{background:var(--accent-soft);color:var(--fg);border-radius:var(--r-sm);padding:11px 13px;font-size:14.5px}
.foot{padding-block:28px 48px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
.foot .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
.foot-links{display:flex;gap:18px;flex-wrap:wrap}.foot-links b{color:var(--fg)}

/* onboarding */
.ob{min-height:100%;background:var(--bg)}
.ob-top{display:flex;align-items:center;gap:16px;min-height:68px}
.ob-progress{margin-left:auto;display:flex;gap:6px}
.ob-progress span{width:28px;height:4px;border-radius:2px;background:var(--line)}
.ob-progress span.on{background:var(--accent)}
.ob-main{max-width:640px;padding-block:28px 72px}
.ob-step{font-size:14px;font-weight:600;color:var(--muted)}
.ob-h{font-size:clamp(30px,4.6vw,42px);line-height:1.06;margin-top:8px;letter-spacing:-.035em}
.ob-p{color:var(--muted);font-size:17px;margin-top:12px}
.ob-body{margin-top:28px;display:grid;gap:26px}
.sugg{list-style:none;margin:8px 0 0;padding:4px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);display:grid;gap:2px;box-shadow:var(--shadow)}
.sugg:empty{display:none}
.sugg button{width:100%;text-align:left;background:none;border:0;border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.sugg button:hover,.sugg button:focus-visible{background:var(--wash)}
.sugg .uni{font-size:12.5px;font-weight:700;color:var(--muted);flex:none}
.sugg .free{color:var(--accent);font-weight:700}
.ob-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fam-grid{display:grid;gap:8px}
@media(min-width:560px){.fam-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fam{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-md);padding:12px 14px;cursor:pointer}
.fam[aria-pressed="true"]{border-color:var(--accent)}
.fam[aria-pressed="false"]{opacity:.5;background:transparent}
.fam[aria-pressed="false"] .fam-name{text-decoration:line-through}
.fam-name{font-weight:700;font-size:14.5px;min-width:0;flex:1}
.fam-fit{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:10px;height:4px;border-radius:1px;background:var(--line)}
.dots i.on{background:var(--accent)}
.notice{background:var(--worth-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14.5px}

/* skolevalg og uddannelsesliste */
.demo-more{display:grid;gap:8px}
.demo-more-h{font-size:13px;font-weight:700;color:var(--muted)}
.school-group{display:grid;gap:10px}
.blurb{font-size:15px;color:var(--fg)}
.src{font-size:12.5px;color:var(--muted);margin-top:-4px}
.hero-schools{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));grid-auto-flow:dense;gap:8px}
.hero-schools .school-chip.wide{grid-column:span 2}
.school-chip{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:12px 8px;font-weight:700;font-size:15px;cursor:pointer;color:var(--fg);text-align:center;letter-spacing:-.01em}
.school-chip:hover{border-color:var(--fg);background:var(--surface-2)}
.school-chip.ghost{font-weight:600;color:var(--muted)}
.school-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.school-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.school{display:grid;gap:3px;align-content:start;text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-md);padding:16px;cursor:pointer;min-width:0}
.school:hover{border-color:var(--fg)}
.school-abbr{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:var(--fg)}
.school-full{font-size:13.5px;font-weight:500;color:var(--fg)}
.school-n{font-size:12.5px;color:var(--muted)}
.school-other .school-abbr{color:var(--accent)}
.prog-list{list-style:none;margin:0;padding:4px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);display:grid;gap:2px;max-height:420px;overflow:auto}
.prog-list button{width:100%;text-align:left;background:none;border:0;border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;display:flex;gap:12px;align-items:baseline;justify-content:space-between}
.prog-list button:hover,.prog-list button:focus-visible{background:var(--wash)}
.prog-list .pn{min-width:0;font-weight:500}
.prog-list .pl{flex:none;font-size:12px;font-weight:700;color:var(--muted)}
.prog-list .free{color:var(--accent)}
.prog-list .none{padding:10px 12px;color:var(--muted)}

/* app */
.app{background:var(--surface-2);min-height:100%}
.app-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding-block:20px 120px}
@media(min-width:900px){.app-grid{grid-template-columns:200px minmax(0,1fr);padding-block:28px 64px}}
@media(min-width:1180px){.app-grid{grid-template-columns:200px minmax(0,680px) minmax(0,1fr)}}
.rail{display:none}
@media(min-width:900px){.rail{display:grid;gap:4px;align-content:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}}
.rail button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:var(--r-sm);padding:9px 12px;cursor:pointer;font-weight:600;color:var(--muted);text-align:left}
.rail button:hover{background:var(--surface);color:var(--fg)}
.rail button[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.rail svg{width:18px;height:18px;flex:none}
.rail .count{margin-left:auto;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.side{display:none}
@media(min-width:1180px){.side{display:grid;gap:16px;align-content:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
@media(min-width:900px){.tabbar{display:none}}
.tabbar button{background:none;border:0;display:grid;justify-items:center;gap:3px;padding:9px 2px 8px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar svg{width:22px;height:22px}
.tabbar .badge{position:absolute;top:5px;left:calc(50% + 8px);font-size:10px;font-weight:800;background:var(--hidden);color:var(--accent-ink);border-radius:999px;padding:0 5px;line-height:16px}
.hide-mobile{display:none}
@media(min-width:900px){.hide-mobile{display:inline-flex}}
@media(min-width:1180px){.only-narrow{display:none}}
@media(max-width:480px){.top-links .link-quiet{display:none}}
@media(max-width:440px){.why-long{display:none}.job .actions{gap:4px}.actions .icon-btn{width:36px;height:36px}.actions .icon-btn svg{width:17px;height:17px}.why-btn{padding:8px 2px}.actions .b-like{display:none}}

.feed-col{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.h-feed{font-size:clamp(28px,3.6vw,34px);line-height:1.08;letter-spacing:-.035em}
.sub{color:var(--muted);margin-top:6px;font-size:15px}
.filter-note{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 16px;font-size:14.5px;color:var(--muted)}
.filter-note b{color:var(--fg);font-weight:700}
.filtered{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:6px 14px 10px;font-size:14.5px;color:var(--muted)}
.fl-head{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:6px 0}
.fl-head b{color:var(--fg)}
.fl-head svg{width:18px;height:18px;transition:transform .15s}
.fl-head[aria-expanded="true"] svg{transform:rotate(180deg)}
.fl-head:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.fl-why,.fl-jobs{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.fl-why li{display:flex;align-items:center;justify-content:space-between;gap:2px 8px;flex-wrap:wrap}
.fl-why li .btn{margin-left:auto;padding-inline:0}
.fl-why b{color:var(--fg)}
.fl-jobs{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;gap:8px}
.fl-jobs li{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:center}
.fl-t{color:var(--fg);font-weight:600;grid-column:1}
.fl-s{font-size:13px;grid-column:1}
.fl-jobs .btn{grid-column:2;grid-row:1/span 2}
.cards{display:grid;gap:12px}

/* jobkort */
.job{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px 14px;display:grid;gap:14px;transition:opacity .25s,transform .25s}
.job.leaving{opacity:0;transform:translateX(24px)}
.job-top{display:flex;gap:13px;align-items:flex-start}
.monogram{width:42px;height:42px;border-radius:var(--r-sm);display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);flex:none;letter-spacing:-.01em}
.job-head{min-width:0;flex:1}
.job-badges{display:flex;gap:6px;margin-top:4px}
.job-co{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center}
.job-co .co-name{color:var(--fg);font-weight:600}
.job-title{font-family:var(--font-display);font-size:19px;line-height:1.25;font-weight:700;letter-spacing:-.02em;margin-top:2px;text-wrap:balance}
.lvl{flex:none;display:grid;justify-items:end;gap:6px}
.lvl-pill{font-size:13px;font-weight:600;padding:0;white-space:nowrap}
.lvl-strong .lvl-pill{color:var(--accent)}
.lvl-good .lvl-pill{color:var(--good)}
.lvl-worth .lvl-pill{color:var(--worth)}
.meter{display:flex;gap:3px}
.meter i{width:14px;height:4px;border-radius:1px;background:var(--line)}
.lvl-strong .meter i{background:var(--accent)}
.lvl-good .meter i:nth-child(-n+2){background:var(--good)}
.lvl-worth .meter i:nth-child(1){background:var(--worth)}
@media(max-width:560px){.job-top{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"mono lvl" "head head";row-gap:10px}.job-top .monogram{grid-area:mono}.job-top .lvl{grid-area:lvl;align-self:center}.job-top .job-head{grid-area:head}}

    const res = await fetch("/api/"+path, {method: method || (body===undefined ? "GET" : "POST"), credentials:"same-origin",
      headers: body===undefined ? {} : {"Content-Type":"application/json"}, body: body===undefined ? undefined : JSON.stringify(body)});
    let data={}; try{ data=await res.json(); }catch(e){}
    return {ok:res.ok, status:res.status, data};
  }catch(e){ return {ok:false, status:0, data:{error:"Ingen forbindelse. Prøv igen."}}; }
}

/* Når man logger ind, vinder det, der er gemt på brugeren. Er brugeren tom, gemmes det, man har lavet i browseren. */
function applyServer(d){
  if(d.state && d.state.onboarded){
    const keepView=S.view;
    S=Object.assign(fresh(), d.state, {profile:Object.assign(freshProfile(), d.profile||{})});
    if(S.profile.hoursMax===25) S.profile.hoursMax=40;
    if(S.profile.danish==="some") S.profile.danish="none";
    S.view = keepView==="landing" ? "landing" : "app";
    persist();
  } else if(S.onboarded) syncSoon();
}

/* ============ FORSTÅ UDDANNELSEN ============ */
function derive(name){
  const t=norm(name); const w={};
  for(const [re,map] of RULES){ if(re.test(t)) for(const f in map) w[f]=Math.max(w[f]||0,map[f]); }
  if(!Object.keys(w).length) return {customer:.6,operations:.55,salesops:.5,marketing:.5,bizdev:.45,hr:.45,pmo:.4};
  return w;
}
const PROGRAMS = [];
for(const s of SCHOOLS){ for(const lv in s.lists){ for(const name of s.lists[lv]){
  const k=s.key+"|"+name; const ln=name.toLowerCase(); let region=s.region;
  for(const [re,r] of CAMPUS){ if(re.test(ln)) region=r; }
  PROGRAMS.push({id:s.key+"-"+lv+"-"+norm(name).replace(/ /g,"-"),name,uni:s.key,level:lv,region,aliases:ALIASES[k]||[],w:OVERRIDE[k]||NAME_OVERRIDE[name]||derive(name)});
} } }
const progById = id => PROGRAMS.find(p=>p.id===id);
const schoolOf = k => SCHOOLS.find(s=>s.key===k);
function shortName(n){ return n.replace(/^(BSc|MSc|MSSc) in /,"").replace(/^Cand\.merc\.\s*i\s+/i,"").replace(/\s*\((København|Køge|Emdrup|Ballerup|Lyngby|Herning|Aarhus|Djursland|Nødebo|Odense|Kolding|Esbjerg|Sønderborg|Vejle|Slagelse|Aalborg)\)$/,"").trim(); }
function programsFor(uni, level, q){
  const toks=norm(q).split(" ").filter(Boolean);
  let list=PROGRAMS.filter(p=>(uni==="other"||p.uni===uni) && (level==="all"||p.level===level));
  if(toks.length) list=list.filter(p=>{ const hay=norm([p.name,...p.aliases,uni==="other"?p.uni:""].join(" ")); return toks.every(t=>hay.includes(t)); });
  const nq=norm(q);
  return list.sort((a,b)=>{ const as=nq&&norm(a.name).startsWith(nq)?0:1, bs=nq&&norm(b.name).startsWith(nq)?0:1; return (as-bs) || a.name.localeCompare(b.name,"da"); });
}
function findProgram(text, uni){
  const t=norm(text); if(!t) return null;
  const u=uni||"other";
  const pool=PROGRAMS.filter(p=>u==="other"||p.uni===u);
  const exact=pool.find(p=>norm(p.name)===t || norm(shortName(p.name))===t || p.aliases.some(a=>norm(a)===t));
  if(exact) return exact;
  const hits=programsFor(u,"all",text);
  return hits.length===1 ? hits[0] : null;
}
function setProgram(p, keepRegion){

  pr.programId=p.id; pr.programName=p.name; pr.programShort=shortName(p.name); pr.weights={...p.w}; pr.guessed=false;
  pr.uni=s.name; pr.uniKey=s.key; pr.level=p.level; if(!keepRegion) pr.regions=nearAreas(p.region);
  pr.studyText=p.name; S.disabled=[]; pr.aiWeights=false;
}
/* AI-agenten tolker uddannelser, vi ikke kender (kræver backend med AI slået til) */
async function aiProgram(name, school, target){
  if(!ACC.backend) return;
  const r=await api("agent/program",{name, school});
  const w=r.ok && r.data.weights; if(!w || !Object.keys(w).length) return;
  const p=S.profile;
  if(target==="primary" && p.programName===name){ p.weights=w; p.aiWeights=true; }
  else { const e=(p.extra||[]).find(x=>x.name===name); if(!e) return; e.weights=w; e.ai=true; }
  commit(); toast(`Vores AI har tolket “${name}”, så dine matches passer bedre.`);
}
function programEntry(prog, text, uniKey){
  if(prog){ const s=schoolOf(prog.uni); return {id:prog.id, name:prog.name, uni:s.name, uniKey:s.key, level:prog.level, weights:{...prog.w}, guessed:false}; }
  const s=uniKey && uniKey!=="other" ? schoolOf(uniKey) : null;
  let name=text.trim(); name=name.charAt(0).toUpperCase()+name.slice(1);
  return {id:null, name, uni:s?s.name:"", uniKey:s?s.key:"", level:"", weights:derive(name), guessed:true};
}
function addExtra(entry){
  const p=S.profile; p.extra=p.extra||[];
  if(norm(entry.name)===norm(p.programName) || p.extra.some(e=>norm(e.name)===norm(entry.name))) return toast("Den uddannelse er allerede på din profil.");
  p.extra.push(entry); p.extra=p.extra.slice(-3);
  commit(); toast(`${entry.name} er tilføjet. Dine matches bruger nu begge uddannelser.`);
  track("program_changed",{label:entry.name});
  if(entry.guessed) aiProgram(entry.name, entry.uni, "extra");
}
function makePrimary(i){
  const p=S.profile; const e=p.extra[i]; if(!e) return;
  const old={id:p.programId, name:p.programName, uni:p.uni, uniKey:p.uniKey, level:p.level, weights:p.weights, guessed:p.guessed};
  p.extra.splice(i,1); if(old.name) p.extra.unshift(old);
  p.programId=e.id; p.programName=e.name; p.programShort=shortName(e.name); p.uni=e.uni; p.uniKey=e.uniKey; p.level=e.level; p.weights={...e.weights}; p.guessed=e.guessed; p.aiWeights=!!e.ai; p.studyText=e.name;
}
function setFreeText(text, uniKey, keepRegion){

  let name=text.trim(); name=name.charAt(0).toUpperCase()+name.slice(1);

  aiProgram(pr.programName, pr.uni, "primary");
}

/* ============ MATCHING ============ */
/* Har man flere uddannelser (fx bachelor + kandidat), tæller den bedste pasform pr. felt */
function effW(p){
  const w={...(p.weights||{})};
  for(const e of p.extra||[]) for(const f in e.weights||{}) w[f]=Math.max(w[f]||0,e.weights[f]);
  return w;
}
/* Felter, man har erfaring i: fra CV'et og fra de tidligere job, man selv har skrevet */
function famsFromText(t){
  const s=" "+String(t||"").toLowerCase()+" "; const out=[];
  for(const f in TITLE_KW) if(TITLE_KW[f].some(k=>s.includes(k))) out.push(f);
  return out;
}
/* AI-agentens vurdering: hvilke uddannelser jobbet passer til (sat af jobindsamleren, når AI er slået til) */
function studyHay(p){
  const prog=p.programId?progById(p.programId):null;
  return " "+norm([p.programName,p.studyText,...(prog?prog.aliases:[]),...(p.extra||[]).map(e=>e.name)].join(" "))+" ";
}
function aiFits(job, p){
  if(!job.studies || !job.studies.length) return null;
  const hay=studyHay(p); const words=hay.split(" ").filter(w=>w.length>=5);
  return job.studies.some(t=>{ const n=norm(t); return n && (hay.includes(" "+n+" ") || hay.includes(n) && n.length>=5 || words.some(w=>n.split(" ").includes(w))); });
}
function expFams(p){ return [...new Set([...(p.cvFams||[]),...(p.pastJobs||[]).flatMap(famsFromText)])].filter(f=>FAM[f]); }
function ctxOf(c){ return c || {profile:S.profile, learned:S.learned, disabled:S.disabled}; }
/* Job, der kun er for studerende på en bestemt uddannelse (sat af jobindsamleren) */
const REQ_STUDY = {
  jura:/jura|\bjur\b|\blaw\b|erhvervsjura|retsvidenskab/, sygepleje:/sygepleje|nursing/, medicin:/(^| )medicin( |$)|medicine|læge/,
  farmaci:/farmaci|pharma/, psykologi:/psykolog/, paedagog:/pædagog/, socialraadgiver:/socialrådgiv|socialt arbejde/,
  tandpleje:/tandpleje|odontologi|tandlæge/, audiologopaedi:/audiologopædi/, arkitekt:/arkitekt/, konstruktoer:/konstruktør|byggeri/,
  ingenioer:/ingeniør|engineering|byggeri|bygning|konstruktion|maskin|elektro|anlæg|civil|kemiteknik|teknologi/,
  maritim:/maskinmester|skibsfører|skibsofficer|maritim/, oekonomi:/økonomi|economics|polit/
};
function studyFits(req, p){
  const rx = REQ_STUDY[req]; if(!rx) return true;
  const prog = p.programId ? progById(p.programId) : null;
  const hay = norm([p.programName, p.studyText, ...(prog ? prog.aliases : []), ...(p.extra||[]).map(e=>e.name)].join(" "));
  if(req==="ingenioer" && /global business/.test(hay)) return false;  /* GBE er ikke en teknisk ingeniøruddannelse i denne forstand */
  return rx.test(hay);
}
/* Studiejob eller praktik. Jobhentningen sætter job.kind, ellers gætter vi ud fra titlen (eksempeljob og direkte opslag).
   "intern" tæller kun, når det ikke er det danske tillægsord, fx "intern kommunikation". */
const INTERN_RE=/\b(?:[Ii]ntern|INTERN)[sS]?\b(?=\s*$|\s*[,|–\-:(\/&)]|\s+(?:for|at|to|in|with|til|hos|i|ved)\b|\s+[A-ZÆØÅ0-9])/;
function guessKind(t){
  const pr=/praktik|internship|trainee/i.test(t)||INTERN_RE.test(t);
  const sj=/studiejob|studentermedhj|studentermedarbejder|student\s*(?:assistant|worker|job|helper)|studentassistent/i.test(t);
  return pr&&sj?"begge":pr?"praktik":"studiejob";
}
function jobKind(j){ return j.kind||(j.kind=guessKind(j.title||"")); }
function inKind(j,k){ const x=jobKind(j); return x===k||x==="begge"; }
const KINDS=[{id:"studiejob",l:"Studiejob",sub:"Ved siden af studiet",icon:"briefcase",many:"studiejob"},{id:"praktik",l:"Praktik",sub:"Praktikplads og internship",icon:"cap",many:"praktikpladser"}];
function evaluate(job, c){
  c=ctxOf(c); const p=c.profile, W=effW(p);
  if(job.req && !studyFits(job.req, p)) return {out:"study"};
  if(c.disabled.includes(job.fam)) return {out:"field"};
  if(job.danish==="required" && p.danish!=="fluent") return {out:"danish"};
  const jr=area(job.region); if(!p.regions.includes("any") && jr!=="remote" && jr!=="dk" && !p.regions.map(area).includes(jr)) return {out:"location"};
  const prim = W[job.fam]||0;
  let bestSec={f:null,w:0};
  for(const f of job.sec||[]){ const w=(W[f]||0)*.85; if(w>bestSec.w) bestSec={f,w}; }
  /* Er feltet kun gættet ud fra opslagets tekst (ikke titlen), stoler vi mindre på det */
  let degree = Math.max(prim,bestSec.w) * (job.famConf==="text" ? .7 : 1);
  /* Agenten og reglerne stemmer sammen: siger AI'en, at jobbet passer til uddannelsen, løftes det; ellers dæmpes det lidt */
  const ai = aiFits(job,p);
  if(ai===true) degree=Math.max(degree,.8);
  else if(ai===false && !job.openToAll) degree*=.85;
  const secs=job.sec||[];
  const learnedAdj = (c.learned[job.fam]||0) + (secs.length ? .4*secs.reduce((s,f)=>s+(c.learned[f]||0),0)/secs.length : 0);
  const affinity = clamp(degree+learnedAdj,0,1);
  const comps=[{k:"degree",label:"Uddannelse",v:affinity,w:.55}];
  let skillHits=[];
  if(p.skills.length){
    skillHits = job.skills.filter(s=>p.skills.some(u=>norm(u)===norm(s)));
    comps.push({k:"skills",label:"Kompetencer",v:.35+.65*Math.min(1,skillHits.length/Math.min(3,job.skills.length)),w:.25});
  } else comps.push({k:"skills",label:"Kompetencer",v:null,w:.25});
  let interestHit=null;
  if(p.interests.length || p.industries.length){
    let v=.5;
    if(p.interests.includes(job.fam)){ v=1; interestHit=job.fam; }
    else { const s=secs.find(f=>p.interests.includes(f)); if(s){ v=.6; interestHit=s; } }
    if(p.industries.includes(job.industry)){ v=Math.max(v,.8); if(!interestHit) interestHit="ind:"+job.industry; }
    comps.push({k:"interest",label:"Interesser",v,w:.2});
  } else comps.push({k:"interest",label:"Interesser",v:null,w:.2});
  const xf=expFams(p); let expHit=null;
  /* Erfaring kan kun løfte et job: uden match tæller den slet ikke med */
  if(xf.includes(job.fam)) expHit=job.fam; else expHit=secs.find(f=>xf.includes(f))||null;
  comps.push({k:"exp",label:"Erfaring",v:expHit?(expHit===job.fam?1:.8):null,w:.15});
  const live=comps.filter(x=>x.v!==null); const wsum=live.reduce((s,x)=>s+x.w,0);
  let score = live.reduce((s,x)=>s+x.v*x.w,0)/wsum;
  if(job.postedH<12) score+=.03;
  if(job.danish==="plus" && p.danish!=="fluent") score-=.05;
  score=clamp(score,0,1);
  /* Uden reel faglig sammenhæng vises jobbet ikke, uanset interesser */
  const level = affinity<.45 ? null : score>=.72 ? "strong" : score>=.55 ? "good" : score>=.4 ? "worth" : null;
  const vocab=[]; for(const f in W){ if(W[f]>=.6) vocab.push(...(TITLE_KW[f]||[])); }
  const title=" "+job.title.toLowerCase()+" ";
  const obvious = vocab.some(k=>title.includes(k));
  const hidden = !obvious && affinity>=.55 && score>=.5;
  return {score,level,prim,bestSec,affinity,learnedAdj,skillHits,interestHit,expHit,ai,comps,hidden};
}
function reasonsFor(job, ev, c){
  c=ctxOf(c); const p=c.profile; const pos=[], neg=[]; const pname=p.programShort||p.programName||L("din uddannelse","your degree");
  const why=jobWhy(job);
  if(ev.ai===true && why) pos.push(why);
  else if(ev.prim>=.6) pos.push(p.guessed ? L(`${FAM[job.fam].label} passer til det, du har fortalt om dit studie`,`${FAM[job.fam].label} fits what you told us about your studies`) : L(`${FAM[job.fam].label} er et oplagt felt for ${pname}`,`${FAM[job.fam].label} is an obvious field for ${pname}`));
  else if(ev.bestSec.f && ev.bestSec.w>=.45) pos.push(L(`Arbejdet er i høj grad ${FAM[ev.bestSec.f].n}, som passer til ${pname}`,`Much of the work is ${FAM[ev.bestSec.f].n}, which fits ${pname}`));
  else if(ev.prim>=.4) pos.push(L(`Beslægtet med ${pname}`,`Related to ${pname}`));
  if(ev.skillHits.length) pos.push(L(`Du har ${listJoin(ev.skillHits)}`,`You have ${listJoin(ev.skillHits)}`));
  if(ev.expHit) pos.push(L(`Du har erfaring med ${FAM[ev.expHit].n}`,`You have experience with ${FAM[ev.expHit].n}`));
  if(ev.interestHit){ pos.push(ev.interestHit.startsWith("ind:") ? L(`Inden for ${ev.interestHit.slice(4).toLowerCase()}, en branche du har valgt`,`In ${ev.interestHit.slice(4).toLowerCase()}, an industry you picked`) : L(`Matcher din interesse for ${FAM[ev.interestHit].n}`,`Matches your interest in ${FAM[ev.interestHit].n}`)); }
  const l=c.learned[job.fam]||0;
  if(l>=.1) pos.push(L(`Du har tidligere vist interesse for ${FAM[job.fam].n}`,`You have shown interest in ${FAM[job.fam].n} before`));
  if(job.danish==="no" && p.danish!=="fluent") pos.push(L("Arbejdssproget er engelsk","The working language is English"));
  if(job.postedH<12) pos.push(L(`Slået op ${ago(job.postedH)}, så du er tidligt ude`,`Posted ${ago(job.postedH)}, so you are early`));
  if(job.danish==="plus" && p.danish!=="fluent") neg.push(L("Dansk er et plus her","Danish is a plus here"));
  if(job.deadline!=null && job.deadline<=5) neg.push(L(`Ansøgningsfrist om ${job.deadline} dage`,`Application deadline in ${job.deadline} days`));
  if(p.skills.length && !ev.skillHits.length) neg.push(L(`Efterspørger ${job.skills[0]}, som ikke står på din profil`,`Asks for ${job.skills[0]}, which is not on your profile`));
  if(l<=-.1) neg.push(L(`Du har tidligere fravalgt ${FAM[job.fam].n}`,`You have hidden ${FAM[job.fam].n} before`));
  return {pos:pos.slice(0,3),neg:neg.slice(0,2)};
}
function hiddenWhy(job, ev, c){
  c=ctxOf(c); const pname=c.profile.programShort||L("din uddannelse","your degree");
  const work=[job.fam,...(job.sec||[])].filter(f=>(effW(c.profile)[f]||0)>=.5).slice(0,2).map(f=>FAM[f].n);
  const t=job.title.replace(/^Studentermedhjælper – /,"");
  return L(`“${t}” bruger ikke de ord, du ville søge på som ${pname}-studerende, men arbejdet er i praksis ${work.length?listJoin(work):"tæt på dit felt"}.`,
    `“${t}” does not use the words you would search for as a ${pname} student, but the work is really ${work.length?listJoin(work):"close to your field"}.`);
}
function allEvals(){ return JOBS.map(j=>({job:j,ev:evaluate(j)})); }
function fbOf(id){ return S.fb[id] || (S.fb[id]={}); }
function feed(kind){
  kind=kind||S.kind||"studiejob";
  let items = allEvals().filter(x=>inKind(x.job,kind) && !x.ev.out && x.ev.level && !(S.fb[x.job.id]||{}).dismissed && !(S.fb[x.job.id]||{}).applied);
  items = items.filter(x=>!x.job.sponsored || x.ev.score>=.55);
  items.sort((a,b)=>b.ev.score-a.ev.score);
  const out=[];
  while(items.length){
    const recent=out.slice(-2).map(x=>x.job.fam);
    let idx=0;
    if(recent.length===2 && recent[0]===recent[1]){
      const alt=items.findIndex(x=>x.job.fam!==recent[0] && x.ev.score>=items[0].ev.score-.08);
      if(alt>0) idx=alt;
    }
    out.push(items.splice(idx,1)[0]);
  }
  return out;
}
function hiddenFeed(){ return feed().filter(x=>x.ev.hidden); }
function filteredCounts(){

function whyPanel(job, ev, p){
  const rows = ev.comps.map(x=>{
    const na=x.v===null; const pct=na?0:Math.round(x.v*100);
    const note = na ? (x.k==="skills"?"Tilføj kompetencer":x.k==="exp"?(expFams(p).length?"Ikke relevant her":"Tilføj CV"):"Tilføj interesser") : pct+" %";
    return `<div class="bar-row ${na?"na":""}"><span>${x.label}</span><span class="bar"><span style="width:${pct}%"></span></span><span class="v">${note}</span></div>`;
  }).join("");
  const l=ev.learnedAdj; const lt = Math.abs(l)>=.03 ? `<p>Din feedback har flyttet uddannelses-pasformen ${l>0?"op":"ned"} med ${Math.round(Math.abs(l)*100)} point.</p>` : "";
  return `<div class="why-panel">
    ${ev.hidden?`<div class="callout-hidden"><b>Uventet match</b><span>${esc(hiddenWhy(job,ev))}</span></div>`:""}
    <p><b>Sådan er det scoret.</b> Uddannelsen vejer tungest. Derefter kommer kompetencer, interesser og erfaring fra dit CV. Det, du ikke har udfyldt, trækker ikke ned.</p>
    ${rows}${lt}
    <div class="filters-ok"><span>${I.check}Sprog</span><span>${I.check}Område</span><span>${I.check}Felt ikke fravalgt</span></div>
    ${job.live?(()=>{ const m=(S.fb[job.id]||{}).mfb; return `<div class="mfb"><span>Passer jobbet til din uddannelse?</span>${m?`<b>${m==="good"?"Du sagde ja. Tak!":"Du sagde nej. Tak!"}</b>`:`<button class="btn btn-ghost btn-sm" data-act="mfb" data-v="good" data-id="${job.id}">Ja</button><button class="btn btn-ghost btn-sm" data-act="mfb" data-v="bad" data-id="${job.id}">Nej</button>`}</div>`; })():""}
  </div>`;
}

function searchHit(j,q){ const h=norm([j.title,j.titleEn,j.co,j.city,j.blurb,j.blurbEn,(j.skills||[]).join(" "),j.industry].filter(Boolean).join(" ")); return q.split(" ").filter(Boolean).every(w=>h.includes(w)); }
const dlOf = j => j.rolling||j.deadline==null ? 9e9 : j.deadline;
function sortItems(list){
  const s=S.sort||"match";
  if(s==="new") return list.slice().sort((a,b)=>(a.job.postedH??9e9)-(b.job.postedH??9e9));
  if(s==="deadline") return list.slice().sort((a,b)=>dlOf(a.job)-dlOf(b.job));
  return list;
}
function feedResultsHTML(f){
  f=f||feed(); const q=norm(UI.q||"");
  if(!q){ return f.length ? `<div class="cards">${sortItems(f).map(x=>cardHTML(x.job,x.ev)).join("")}</div>` : emptyFeed(); }
  const hits=sortItems(f.filter(x=>searchHit(x.job,q)));
  const ids=new Set(hits.map(x=>x.job.id));
  const extra=sortItems(allEvals().filter(x=>!ids.has(x.job.id) && inKind(x.job,S.kind||"studiejob") && !x.ev.out && !(S.fb[x.job.id]||{}).dismissed && searchHit(x.job,q))).slice(0,30);
  let h=`<p class="fine search-count">${L(`${hits.length} af dine matches passer til “${esc(UI.q.trim())}”`,`${hits.length} of your matches fit “${esc(UI.q.trim())}”`)}</p>`;
  if(hits.length) h+=`<div class="cards">${hits.map(x=>cardHTML(x.job,x.ev)).join("")}</div>`;
  if(extra.length) h+=`<h2 class="group-h">${L(`${extra.length} andre job med “${esc(UI.q.trim())}”`,`${extra.length} other jobs with “${esc(UI.q.trim())}”`)}</h2><p class="fine">${L("De passer ikke så godt til din profil, men indeholder det, du søger efter.","They don't fit your profile as well, but contain what you searched for.")}</p><div class="cards">${extra.map(x=>cardHTML(x.job,x.ev.level?x.ev:{...x.ev,level:"worth"})).join("")}</div>`;
  if(!hits.length && !extra.length) h+=`<div class="empty"><h2>${L("Ingen job fundet","No jobs found")}</h2><p>${L("Prøv et andet ord, fx et firmanavn, en by eller et program som Excel.","Try another word, like a company name, a city or a tool like Excel.")}</p></div>`;
  return h;
}

async function shareJob(j){

  const text=L(`${j.title} hos ${j.co}. Fundet på Studiematch.`,`${j.title} at ${j.co}. Found on Studiematch.`);

}

function tasteHTML(){
  const p=S.profile; const W=effW(p);
  const rows=Object.keys(FAM).filter(f=>(W[f]||0)>=.3 || Math.abs(S.learned[f]||0)>=.05)
    .map(f=>({f,l:S.learned[f]||0,v:clamp((W[f]||0)+(S.learned[f]||0),0,1),off:S.disabled.includes(f)}))
    .sort((a,b)=>(a.off-b.off)||(b.v-a.v)).slice(0,8);
  const any=Object.values(S.learned).some(v=>Math.abs(v)>=.01);
  return `<section class="taste"><h3>Det har vi lært</h3><p class="fine">Starter fra din uddannelse. Hver gang du siger interesseret, gemmer eller fravælger, flytter søjlerne sig.</p>
    ${rows.map(r=>`<div class="trow ${r.off?"off":""}"><span class="tname">${FAM[r.f].label}</span><span class="delta ${r.l>0?"up":r.l<0?"down":""}">${r.off?L("fra","off"):Math.abs(r.l)>=.05?(r.l>0?"+":"−")+Math.round(Math.abs(r.l)*100):""}</span><span class="bar"><span style="width:${Math.round(r.v*100)}%"></span></span></div>`).join("")}
    ${any?`<button class="btn btn-quiet" data-act="reset-learning">Nulstil det, vi har lært</button>`:""}
  </section>`;
}

let pendingApply=null;

      return commit();
    case "ob-next": S.step=Math.min(4,S.step+1); window.scrollTo(0,0); return commit();
    case "ob-back": S.step=Math.max(1,S.step-1); if(S.step===2){ UI.obUni=p.uniKey||UI.obUni||"other"; UI.obText=""; UI.obLevel="all"; } window.scrollTo(0,0); return commit();
    case "fam-toggle": S.disabled = S.disabled.includes(v) ? S.disabled.filter(f=>f!==v) : [...S.disabled,v]; return commit();

      track("like",{jobId:id,label:jobLabel(j)}); fb.liked=true; bump(j.fam,.12); (j.sec||[]).forEach(f=>bump(f,.04)); commit(); return toast(`Noteret. Flere job inden for ${FAM[j.fam].n} fremover.`,true); }
    case "save": { const j=byId(id), fb=fbOf(id); snap();
      if(fb.saved){ fb.saved=false; bump(j.fam,-.05); commit(); return toast("Fjernet fra Gemt",true); }
      track("save",{jobId:id,label:jobLabel(j)}); fb.saved=true; bump(j.fam,.05); commit(); return toast("Gemt. Du finder det under Gemt.",true); }
    case "unsave": { const fb=fbOf(id); snap(); fb.saved=false; fb.applied=false; commit(); return toast("Fjernet",true); }
    case "dismiss": UI.sheet={type:"dismiss",id}; return render();
    case "apply": UI.sheet={type:"apply",id}; return render();

    case "close-sheet": UI.sheet=null; return render();
    case "reason": { const jid=UI.sheet.id; const j=byId(jid); snap(); UI.sheet=null;
      const fb=fbOf(jid); fb.dismissed=v; track("dismiss",{jobId:jid,label:jobLabel(j),meta:({field:"Ikke mit felt",hours:"Forkerte timer",danish:"Sproget passer ikke",location:"For langt væk",company:"Ikke denne virksomhed",other:"Noget andet",skip:"Ingen grund"})[v]||v});
      let msg="Skjult.";
      if(v==="field"){ bump(j.fam,-.2); (j.sec||[]).forEach(f=>bump(f,-.05)); msg=`Skjult. Færre job inden for ${FAM[j.fam].n} fremover.`; }

    case "reset-learning": snap(); S.learned={}; commit(); return toast("Læringen er nulstillet til din uddannelses udgangspunkt.",true);
    case "widen": p.regions=["any"]; commit(); return toast("Viser nu job fra hele landet.");
    case "alerts": p.alerts=!p.alerts; if(p.alerts && !p.alertFreq) p.alertFreq="daily"; commit(); return toast(p.alerts?"Jobmails er slået til.":"Jobmails er slået fra.");
    case "alert-freq": p.alertFreq=v; return commit();
    case "freq": p.alertFreq=v; return commit();
    case "interest": p.interests = p.interests.includes(v) ? p.interests.filter(x=>x!==v) : [...p.interests,v]; return commit();
    case "industry": p.industries = p.industries.includes(v) ? p.industries.filter(x=>x!==v) : [...p.industries,v]; return commit();

    case "delete-ask": UI.confirmDelete=true; return render();
    case "delete-no": UI.confirmDelete=false; return render();
    case "delete-yes": (async()=>{ if(ACC.user){ const r=await api("me",undefined,"DELETE"); if(!r.ok) return toast(r.data.error||"Det lykkedes ikke. Prøv igen."); ACC.user=null; }
      S=fresh(); UI.confirmDelete=false; UI.expanded={}; try{localStorage.removeItem(KEY);}catch(e){} window.scrollTo(0,0); render(); toast("Dine data er slettet."); })(); return;
    case "postjob": track("postjob_open"); UI.sheet={type:"postjob"}; UI.focus="pj-company"; return render();
    case "mfb": { const j=byId(id), fb=fbOf(id); fb.mfb=v; track(v==="good"?"match_good":"match_bad",{jobId:id,label:jobLabel(j),meta:(p.programName||"").slice(0,120)}); commit(); return toast(v==="good"?"Tak! Det hjælper os med at ramme endnu bedre.":"Tak! Vi bruger det til at gøre matchningen bedre."); }
    case "auth": track("auth_open",{meta:v||"login"}); UI.sheet={type:"auth",mode:v||"login"}; UI.focus=v==="signup"?"au-name":"au-mail"; return render();

    case "pw-sheet": UI.sheet={type:"password"}; UI.focus="pw-old"; return render();
    case "logout": (async()=>{ await api("auth/logout",{}); ACC.user=null; S=fresh(); try{localStorage.removeItem(KEY);}catch(e){} window.scrollTo(0,0); render(); toast("Du er logget ud."); })(); return;
    case "nudge-close": S.nudgeClosed=true; return commit();
    case "lang": S.lang=v; p.lang=v; setLang(v); track("filter",{meta:"Sprog: "+v}); syncSoon(); return commit();
    case "share": { const j=byId(id); if(j) shareJob(j); return; }
    case "kind": if(S.kind!==v){ S.kind=v; UI.showFiltered=false; track("filter",{meta:"Type: "+(v==="praktik"?"Praktik":"Studiejob")}); } return commit();
    case "toggle-filtered": UI.showFiltered=!UI.showFiltered; return render();
    case "fields-on": S.disabled=[]; commit(); return toast("Alle felter er slået til igen.");
    case "undismiss": for(const k in S.fb) if(S.fb[k].dismissed) delete S.fb[k].dismissed; commit(); return toast("De fravalgte job vises igen.");
    case "undismiss-one": if(S.fb[id]) delete S.fb[id].dismissed; commit(); return toast("Jobbet vises igen.");
    case "program-sheet": UI.sheet={type:"program",mode:v||"replace",uni:p.uniKey||"other",q:""}; UI.focus="ps-q"; return render();
    case "ps-uni": UI.sheet.uni=v; UI.focus="ps-q"; return render();
    case "ps-pick": case "ps-text": { const sh=UI.sheet; const prog=a==="ps-pick"?progById(id):null; if(!prog && !sh.q.trim()) return;
      UI.sheet=null;
      if(sh.mode==="add") return addExtra(programEntry(prog, sh.q, sh.uni));

    case "cv-remove": (async()=>{ if(ACC.user) await api("me/cv",undefined,"DELETE"); p.cvName=""; p.cvAt=0; p.cvBy=""; p.cvFams=[]; commit(); toast("CV'et er fjernet. Kompetencer og job, du har tilføjet, bliver på profilen."); })(); return;

const CV_SKILLS = ["Kundeservice","Salg","Microsoft Office","Word","PowerPoint","Outlook","Google Analytics","HubSpot","WordPress","Shopify",
  "Adobe","Photoshop","Illustrator","InDesign","Canva","Premiere Pro","Java","C#","C++","TypeScript","Node.js","HTML","CSS","Git","Docker","AWS","Azure",
  "MATLAB","AutoCAD","SolidWorks","Revit","SPSS","Stata","e-conomic","Dinero","Navision","Dynamics","Jira","Scrum","Agile","Six Sigma","Kassesystem",
  "Social media","SEO","Copywriting","Tysk","Fransk","Spansk","Engelsk","Førstehjælp","Kørekort"];
function loadScript(src){ return new Promise((ok,bad)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const t=document.createElement("script"); t.src=src; t.onload=ok; t.onerror=()=>bad(new Error("Kunne ikke hente læseren")); document.head.appendChild(t); }); }
async function cvText(file){
  const name=file.name.toLowerCase();
  if(name.endsWith(".pdf")){
    const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    await loadScript(base+"pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js";
    const doc=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; let out="";
    for(let i=1;i<=Math.min(doc.numPages,6);i++){ const c=await (await doc.getPage(i)).getTextContent(); out+=c.items.map(it=>it.str+(it.hasEOL?"\n":" ")).join("")+"\n"; }
    return out;
  }
  if(name.endsWith(".docx")){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    return (await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value;
  }
  if(name.endsWith(".txt")) return await file.text();
  throw new Error("Vi kan læse PDF, Word (.docx) og tekstfiler. Gem dit CV som PDF og prøv igen.");
}
function cvLocal(text){
  const vocab=[...new Set([...SKILLS_COMMON,...CV_SKILLS,...JOBS.flatMap(j=>j.skills||[])])].filter(v=>v.length>1);
  const low=" "+text.toLowerCase().replace(/\s+/g," ")+" ";
  const skills=vocab.filter(v=>new RegExp(`(^|[^a-zæøå0-9])${v.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}($|[^a-zæøå0-9])`).test(low)).slice(0,15);
  const lines=text.split(/\n+/).map(l=>l.replace(/\s+/g," ").trim()).filter(l=>l.length>=8 && l.length<=140);
  const edu=/uddannelse|bachelor|kandidat|gymnasi|\bhf\b|\bstx\b|\bhhx\b|\bhtx\b|universit|university|education|folkeskole|efterskole|student fra/i;
  const experience=lines.filter(l=>/(19|20)\d{2}/.test(l) && !edu.test(l)).slice(0,8).map(l=>({title:l, org:"", years:"", fams:famsFromText(l)}));
  return {skills, experience, interests:[], summary:"", by:"local"};
}
async function handleCV(file){
  if(!file) return;
  UI.cvBusy=true; render();
  try{
    const text=(await cvText(file)).trim();
    if(text.length<40) throw new Error("Vi kunne ikke finde tekst i filen. Er det et scannet billede? Prøv en PDF, der er gemt fra Word eller Google Docs.");
    let ex=cvLocal(text);
    if(ACC.user){ const r=await api("me/cv",{name:file.name,text}); if(r.ok && r.data.extract){ const a=r.data.extract; ex={...a, skills:[...new Set([...a.skills,...ex.skills])].slice(0,15)}; } }
    UI.sheet={type:"cv", name:file.name, ex, pick:{skills:ex.skills.map(()=>true), experience:ex.experience.map(()=>true), interests:ex.interests.map(()=>true)}};
    track("cv_added");
  }catch(e){ toast(e.message||"CV'et kunne ikke læses."); }
  UI.cvBusy=false; render();
}
function expLabel(e){ return [e.title, e.org].filter(Boolean).join(", ")+(e.years?` (${e.years})`:""); }
function applyCV(){
  const sh=UI.sheet, p=S.profile, ex=sh.ex;
  ex.skills.forEach((v,i)=>{ if(sh.pick.skills[i] && !p.skills.some(s=>norm(s)===norm(v))) p.skills.push(v); });
  const fams=new Set(p.cvFams||[]);
  ex.experience.forEach((e,i)=>{ if(!sh.pick.experience[i]) return; const l=expLabel(e); if(!p.pastJobs.includes(l)) p.pastJobs.push(l); (e.fams||[]).forEach(f=>fams.add(f)); });
  ex.interests.forEach((f,i)=>{ if(sh.pick.interests[i] && !p.interests.includes(f)) p.interests.push(f); });
  p.cvFams=[...fams]; p.cvName=sh.name; p.cvAt=Date.now(); p.cvBy=ex.by;
  UI.sheet=null; commit(); toast("Dit CV er brugt. Dine matches er opdateret.");
}

function canonicalSkill(s){ const t=s.trim(); const hit=SKILLS_COMMON.find(x=>norm(x)===norm(t)); return hit||t; }
function onSubmit(form){
  const k=form.dataset.form, p=S.profile;
  if(k==="ob-prog"){ const t=UI.obText.trim(); if(!t) return; const m=findProgram(t, UI.obUni)||programsFor(UI.obUni, UI.obLevel, t)[0]; if(m) setProgram(m); else setFreeText(t, UI.obUni); S.step=3; window.scrollTo(0,0); return commit(); }
  if(k==="waitlist"){ const g=id=>form.querySelector(id).value.trim();
    api("waitlist",{company:g("#wl-co"),name:g("#wl-name"),email:g("#wl-mail"),message:g("#wl-msg")}).then(r=>{
      if(r.ok || r.status===503){ UI.waitlistDone=true; UI.waitlistErr=""; } else UI.waitlistErr=r.data.error||"Det lykkedes ikke. Skriv til matchstudie@gmail.com.";
      render(); }); return; }
  if(k==="auth") return submitAuth(form);
  if(k==="forgot") return submitForgot(form);
  if(k==="reset") return submitReset(form);
  if(k==="postjob") return submitPostJob(form);
  if(k==="password") return submitPassword(form);
  if(k==="study"){ const t=form.querySelector("#pf-study").value.trim(); if(!t) return; const uni=(document.getElementById("pf-uni")||{}).value||"other"; const m=findProgram(t, uni)||programsFor(uni,"all",t)[0]; if(m) setProgram(m,true); else setFreeText(t, uni, true); UI.pfUni=null; commit(); return toast(`Matcher nu som ${p.programName}${p.uni?" ("+p.uni+")":""}.`); }
  if(k==="skill"){ const inp=form.querySelector("input"); const t=canonicalSkill(inp.value); if(t && !p.skills.some(s=>norm(s)===norm(t))) p.skills.push(t); UI.focus="pf-skill"; return commit(); }
  if(k==="pastJobs"||k==="courses"){ const inp=form.querySelector("input"); const t=inp.value.trim(); if(t) p[k].push(t); UI.focus=inp.id; return commit(); }
}
if(typeof document!=="undefined"){
  document.addEventListener("click",e=>{
    const el=e.target.closest("[data-act]");
    if(!el) return;
    if(el.dataset.act==="close-sheet" && e.target.closest("[data-stop]") && el.classList.contains("scrim")) return;
    if(el.tagName==="A") return;
    e.preventDefault(); act(el.dataset.act, el);
  });
  document.addEventListener("click",e=>{ const a=e.target.closest("a[data-track]"); if(!a) return;
    track("apply_click",{jobId:a.dataset.id,label:jobLabel(byId(a.dataset.id))});
    if(UI.sheet && UI.sheet.type==="apply"){ UI.sheet=null; render(); }
    pendingApply={id:a.dataset.id, at:Date.now()}; }, true);
  window.addEventListener("focus", askIfApplied);
  document.addEventListener("visibilitychange", askIfApplied);
  document.addEventListener("submit",e=>{ e.preventDefault(); onSubmit(e.target); });
  document.addEventListener("input",e=>{
    if(e.target.id==="hero-study") UI.heroText=e.target.value;
    if(e.target.id==="feed-q") onSearch(e.target.value);
    if(e.target.id==="ps-q" && UI.sheet && UI.sheet.type==="program"){ UI.sheet.q=e.target.value; const l=document.getElementById("ps-list"); if(l) l.innerHTML=psListHTML(); }
    if(e.target.id==="ob-study"){ UI.obText=e.target.value; const l=document.getElementById("prog-list"); if(l) l.innerHTML=progListHTML(); const c=document.getElementById("prog-count"); if(c) c.textContent=progCount(); const b=document.getElementById("ob-go"); if(b) b.disabled=!norm(UI.obText); }
  });
  document.addEventListener("change",e=>{
    const k=e.target.dataset.change; if(!k) return; const p=S.profile;
    if(k==="pf-uni"){ UI.pfUni=e.target.value; return render(); }
    if(k==="sort"){ S.sort=e.target.value; track("filter",{meta:"Sortering: "+S.sort}); return commit(); }
    if(k==="semester") p.semester=e.target.value;
    if(k==="email") p.email=e.target.value.trim();
    if(k==="cv"){ const f=e.target.files&&e.target.files[0]; return handleCV(f); }
    commit();
  });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && UI.sheet && !UI.sheet.forced){ UI.sheet=null; render(); } });
  render();
  loadLiveJobs();
  initAccount();
}
/* Henter rigtige job fra data/jobs.json, som jobindsamleren skriver. Findes filen ikke, vises eksempeljob. */
function toLive(j, t){
  return {...j, sec:(j.sec||[]).filter(f=>FAM[f]), skills:j.skills||[], hMin:j.hMin||0, hMax:j.hMax||0,
    postedH: j.postedAt ? Math.max(0,Math.round((t-Date.parse(j.postedAt))/36e5)) : 999,
    deadline: j.rolling ? null : j.deadlineAt ? Math.max(0,Math.ceil((Date.parse(j.deadlineAt)-t)/864e5)) : null,
    industry: j.industry||"Andet", live:true};
}
async function loadLiveJobs(){
  const t = Date.now(); let live=[];
  try{
    const res = await fetch("data/jobs.json",{cache:"no-store"});
    if(res.ok){ const data=await res.json(); if(Array.isArray(data)) live=data.filter(j=>j && j.title && j.id && FAM[j.fam]).map(j=>toLive(j,t)); }
  }catch(e){}
  /* Job, som virksomheder har slået op direkte, og som I har godkendt i admin */
  try{
    const r=await fetch("/api/jobs");
    if(r.ok){ const d=await r.json(); const direct=(d.jobs||[]).filter(j=>j && j.title && FAM[j.fam]).map(j=>toLive(j,t)); live=[...direct,...live];
      const hidden=new Set(d.hidden||[]); if(hidden.size) live=live.filter(j=>!hidden.has(j.id)); /* job, I har skjult i admin */ }
  }catch(e){}
  if(!live.length) return;
  JOBS.length=0; JOBS.push(...live);
  INDUSTRIES.length=0; INDUSTRIES.push(...[...new Set(JOBS.map(j=>j.industry))].sort((a,b)=>a.localeCompare(b,"da")));
  LIVE=true; render(); openShared();
}
